<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Action Hub</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.SIM2_FB = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;
        
        const waitForFirebase = (callback) => {
            if (window.SIM2_FB) callback(window.SIM2_FB);
            else setTimeout(() => waitForFirebase(callback), 50);
        };

        const formatSpecialDate = (dateStr) => {
            if (!dateStr) return '---';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr; 
            
            const dayMonth = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
            const year = d.getFullYear();
            const currentYear = new Date().getFullYear();
            
            if (year < currentYear) {
                return <span className="whitespace-nowrap">{dayMonth}-<span className="text-orange-500 font-black text-[0.8em]">{year}</span></span>;
            }
            return <span className="whitespace-nowrap">{dayMonth}-<span className="text-[0.8em]">{year}</span></span>;
        };

        const calculateDays = (start, end) => {
            if (!start || !end) return '---';
            const diff = new Date(end) - new Date(start);
            return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24))) + ' วัน';
        };

        const parseCost = (val) => {
            if (!val) return 0;
            const num = String(val).replace(/[^0-9.-]+/g,"");
            return parseFloat(num) || 0;
        };

        const GEMINI_MODEL = "gemini-3.1-flash-lite";
        
        const fetchGemini = async (prompt, userKey, systemPrompt = "คุณคือผู้ช่วยจัดการโครงการอุตสาหกรรมมืออาชีพ") => {
            if (!userKey) throw new Error("NO_API_KEY");
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            while (retries < 5) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${userKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error?.message || "API Error");
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (error) {
                    if (error.message === "NO_API_KEY") throw error;
                    if (retries === 4) throw error;
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                Dashboard: <Fragment><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/></Fragment>,
                List: <Fragment><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Fragment>,
                Plus: <Fragment><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Fragment>,
                Search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                Trash: <Fragment><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Fragment>,
                Target: <Fragment><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Fragment>,
                Info: <Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></Fragment>,
                Clock: <Fragment><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Fragment>,
                Cloud: <Fragment><path d="M17.5 19c2.5 0 4.5-2 4.5-4.5 0-2.3-1.7-4.2-4-4.5C17.1 6.3 14 4 10.5 4 7.2 4 4.5 6.4 4.1 9.6 1.8 10.1 0 12.1 0 14.5 0 17 2 19 4.5 19h13z"/></Fragment>,
                Menu: <Fragment><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></Fragment>,
                X: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>,
                Sparkle: <Fragment><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></Fragment>,
                Settings: <Fragment><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Fragment>,
                TrendingUp: <Fragment><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Fragment>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || null}</svg>;
        };

        const AiNextStep = ({ title, description, cost, setMsg, fetchGemini, userApiKey, setShowApiKeyModal }) => {
            const [loading, setLoading] = useState(false);
            const [suggestion, setSuggestion] = useState("");
            const getSteps = async () => {
                if (suggestion) { setSuggestion(""); return; }
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setLoading(true);
                try {
                    const prompt = `งานคือ "${title}". คำอธิบาย: "${description}". ค่าใช้จ่ายที่ระบุ: ${cost || 0} บาท ช่วยแนะนำ 3 ขั้นตอนต่อไปเพื่อทำให้งานนี้สำเร็จ เป็นข้อแนะนำสั้นๆ กระชับ ภาษาไทย`;
                    const result = await fetchGemini(prompt, userApiKey, "คุณคือที่ปรึกษาด้านการจัดการโครงการโรงงาน");
                    setSuggestion(result);
                } catch (e) { 
                    if(e.message === "NO_API_KEY") setShowApiKeyModal(true);
                    else setMsg("AI Insight failed: " + e.message); 
                }
                setLoading(false);
            };
            return (
                <div className="flex flex-col items-end w-full">
                    <button onClick={getSteps} disabled={loading} className="text-[9px] font-bold text-[#3dcd58] flex items-center gap-1.5 hover:text-[#2fa847] transition-colors active:scale-95 disabled:opacity-50">
                        <Icon name="Sparkle" size={12} className={loading ? "animate-spin" : ""} />
                        {suggestion ? "✨ Hide Insights" : "✨ AI Next Steps"}
                    </button>
                    {suggestion && (
                        <div className="mt-3 p-4 bg-gradient-to-r from-[#3dcd58]/10 to-transparent rounded-lg text-[10px] md:text-xs text-slate-700 italic animate-in w-full text-left whitespace-pre-line border-l-2 border-[#3dcd58]">
                            {suggestion}
                        </div>
                    )}
                </div>
            );
        };

        const SidebarBtn = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-3 md:gap-4 px-6 md:px-8 py-3 md:py-4 transition-all duration-300 border-l-4 border-transparent ${active ? 'nav-item-active text-white' : 'text-slate-500 hover:text-white hover:bg-white/5'}`}>
                <span className={active ? 'scale-110' : 'opacity-30'}>{icon}</span>
                <span className="font-bold text-[9px] md:text-[10px] uppercase tracking-wider italic leading-none">{label}</span>
            </button>
        );

        const StatCard = ({ label, value, color, prefix = "" }) => (
            <div className="bg-white p-6 md:p-10 rounded-[1.5rem] md:rounded-[2.5rem] border border-slate-100 soft-shadow flex flex-col group overflow-hidden relative text-center">
                <div className={`absolute top-0 left-0 w-full h-1.5 md:h-2 ${color} opacity-80 group-hover:h-2.5 transition-all`} />
                <div className="text-3xl md:text-5xl font-black text-slate-800 tracking-tighter italic leading-none tabular-nums mt-2 md:mt-4 mb-1 md:mb-2 group-hover:scale-105 transition-transform origin-center flex items-baseline justify-center">
                    {prefix && <span className="text-xl md:text-2xl mr-1 text-slate-400">{prefix}</span>}
                    {value}
                </div>
                <p className="text-[7px] md:text-[9px] font-black text-slate-400 uppercase tracking-widest italic">{label}</p>
            </div>
        );

        const FormInput = ({ label, val, onChange, placeholder, type="text" }) => (
            <div className="space-y-1">
                <label className="text-[8px] md:text-[9px] font-bold text-slate-400 uppercase italic ml-1">{label}</label>
                <input type={type} className="w-full p-2.5 md:p-3 bg-slate-50 border border-slate-100 rounded-xl text-[10px] md:text-[11px] font-bold italic uppercase outline-none focus:border-[#3dcd58] transition shadow-sm" placeholder={placeholder} value={val} onChange={(e) => onChange(e.target.value)} />
            </div>
        );

        const DetailRow = ({ label, val }) => (
            <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-0.5 md:gap-1 overflow-hidden">
                <span className="text-[6px] md:text-[7px] font-black text-slate-400 uppercase italic leading-none tracking-widest">{label}</span>
                <span className="text-[9px] md:text-[10px] font-bold text-slate-700 italic leading-tight pr-1 break-words">{val || '---'}</span>
            </div>
        );

        const EditableField = ({ label, value, onSave, placeholder }) => {
            const [val, setVal] = useState(value || '');
            useEffect(() => setVal(value || ''), [value]);
            return (
                <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-0.5 md:gap-1 overflow-hidden group hover:border-[#3dcd58]/30 transition-colors">
                    <span className="text-[6px] md:text-[7px] font-black text-slate-400 uppercase italic leading-none tracking-widest group-focus-within:text-[#3dcd58] transition-colors">{label}</span>
                    <input
                        className="text-[9px] md:text-[10px] font-bold text-slate-700 italic leading-tight pr-1 bg-transparent border-b border-dashed border-slate-300 focus:border-[#3dcd58] outline-none w-full transition-colors pb-0.5"
                        value={val}
                        placeholder={placeholder}
                        onChange={(e) => setVal(e.target.value)}
                        onBlur={() => { if (val !== (value || '')) onSave(val); }}
                    />
                </div>
            );
        };

        const App = ({ fb }) => {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } = fb;
            
            const firebaseConfig = {
              apiKey: "AIzaSyBpb35n86yKm-etaqI9ilvPosBe4OyDogs",
              authDomain: "sim2-management-rattanachot.firebaseapp.com",
              projectId: "sim2-management-rattanachot",
              storageBucket: "sim2-management-rattanachot.firebasestorage.app",
              messagingSenderId: "1050876853626",
              appId: "1:1050876853626:web:a9cfa2b91416426a686ac3",
              measurementId: "G-KE7P699K7N"
            };

            const app = useMemo(() => initializeApp(firebaseConfig), []);
            const auth = useMemo(() => getAuth(app), [app]);
            const db = useMemo(() => {
                try {
                    return initializeFirestore(app, { experimentalForceLongPolling: true });
                } catch (e) {
                    return getFirestore(app);
                }
            }, [app, initializeFirestore, getFirestore]);
            const appId = 'sim2-mgmt-rattanachot';

            const [user, setUser] = useState(null);
            const [allData, setAllData] = useState([]);
            const [meta, setMeta] = useState(null);
            const [view, setView] = useState('dashboard');
            const [search, setSearch] = useState('');
            const [filterStatus, setFilterStatus] = useState('All');
            const [expandedId, setExpandedId] = useState(null);
            const [msg, setMsg] = useState(null);
            const [syncProgress, setSyncProgress] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            const [userApiKey, setUserApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [tempApiKey, setTempApiKey] = useState('');
            const [aiSummary, setAiSummary] = useState("");
            const [isAiLoading, setIsAiLoading] = useState(false);

            const [newItem, setNewItem] = useState({
                'Action Id': '', 'Title': '', 'Description': '', 'Opening Date': new Date().toISOString(), 'Status': 'Open', 'In_Charge': 'Rattanachot Siriwanit', 'Line': '', 'Cost': '' 
            });
            const publicPath = ['artifacts', appId, 'public', 'data'];

            useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, [auth]);

            useEffect(() => {
                if (!user) return;
                const actionsCol = collection(db, ...publicPath, 'actions');
                const unsubData = onSnapshot(actionsCol, (snap) => setAllData(snap.docs.map(doc => ({ ...doc.data(), _id: doc.id }))));
                const metaDoc = doc(db, ...publicPath, 'metadata', 'sync_info');
                const unsubMeta = onSnapshot(metaDoc, (docSnap) => { if (docSnap.exists()) setMeta(docSnap.data()); });
                return () => { unsubData(); unsubMeta(); };
            }, [user, db]);

            useEffect(() => setIsSidebarOpen(false), [view]);

            const filteredTasks = useMemo(() => {
                let tasks = allData.filter(t => {
                    const nameFields = String(t.In_Charge || t.Owner || t.Raiser || t.Responsible || t.OwnerName || t.Rattanachot || '').toLowerCase();
                    const isMe = nameFields.includes('rattanachot') || nameFields.includes('siriwanit') || nameFields.includes('รัตนโชติ');
                    const matchSearch = Object.values(t).some(v => String(v).toLowerCase().includes(search.toLowerCase()));
                    return isMe && matchSearch;
                });

                if (filterStatus !== 'All') {
                    tasks = tasks.filter(t => (t.Status || '').toLowerCase().includes(filterStatus.toLowerCase()));
                }

                tasks.sort((a, b) => {
                    const statusA = (a.Status || '').toLowerCase();
                    const statusB = (b.Status || '').toLowerCase();
                    const isClosedA = statusA.includes('closed') ? 1 : 0;
                    const isClosedB = statusB.includes('closed') ? 1 : 0;
                    
                    if (isClosedA !== isClosedB) return isClosedA - isClosedB; 
                    
                    const dateA = new Date(a['Opening Date'] || a.OpenedAt || 0).getTime();
                    const dateB = new Date(b['Opening Date'] || b.OpenedAt || 0).getTime();
                    return dateB - dateA;
                });

                return tasks;
            }, [allData, search, filterStatus]);

            const stats = useMemo(() => {
                const baseTasks = allData.filter(t => {
                    const nameFields = String(t.In_Charge || t.Owner || t.Raiser || t.Responsible || t.OwnerName || t.Rattanachot || '').toLowerCase();
                    return nameFields.includes('rattanachot') || nameFields.includes('siriwanit') || nameFields.includes('รัตนโชติ');
                });

                const total = baseTasks.length;
                const open = baseTasks.filter(t => (t.Status || '').toLowerCase().includes('open')).length;
                const closed = baseTasks.filter(t => (t.Status || '').toLowerCase().includes('closed')).length;
                const progress = baseTasks.filter(t => (t.Status || '').toLowerCase().includes('progress')).length;
                
                const totalCost = baseTasks.reduce((sum, t) => sum + parseCost(t.Cost || t.Budget || 0), 0);
                
                return { total, open, closed, progress, totalCost };
            }, [allData]);

            const monthlyBudget = useMemo(() => {
                const targetYear = 2026;
                const months = {};
                for(let i = 0; i < 12; i++) {
                    const d = new Date(targetYear, i, 1);
                    const key = `${targetYear}-${String(i + 1).padStart(2, '0')}`;
                    const label = d.toLocaleString('en-US', {month: 'short'}).toUpperCase();
                    months[key] = { label, cost: 0, key };
                }

                allData.forEach(t => {
                    const nameFields = String(t.In_Charge || t.Owner || t.Raiser || t.Responsible || t.OwnerName || t.Rattanachot || '').toLowerCase();
                    const isMe = nameFields.includes('rattanachot') || nameFields.includes('siriwanit') || nameFields.includes('รัตนโชติ');
                    if(!isMe) return;

                    const d = new Date(t['Opening Date'] || t.OpenedAt);
                    if (isNaN(d.getTime())) return;
                    if (d.getFullYear() !== targetYear) return; 
                    
                    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    
                    if (months[key]) {
                        months[key].cost += parseCost(t.Cost || t.Budget || 0);
                    }
                });

                const result = Object.values(months);
                const maxCost = Math.max(...result.map(m => m.cost), 1);
                return result.map(m => ({...m, height: `${(m.cost / maxCost) * 100}%`}));
            }, [allData]);

            const total2026Spent = monthlyBudget.reduce((sum, m) => sum + m.cost, 0);
            
            // Get current month key for highlighting chart
            const currentMonthKey = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;

            const saveApiKey = () => {
                localStorage.setItem('gemini_api_key', tempApiKey);
                setUserApiKey(tempApiKey);
                setShowApiKeyModal(false);
                setMsg("API Key Saved Local!");
            };

            const clearApiKey = () => {
                localStorage.removeItem('gemini_api_key');
                setUserApiKey('');
                setTempApiKey('');
            };

            const handleGenerateSummary = async () => {
                if (filteredTasks.length === 0) return;
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setIsAiLoading(true);
                try {
                    const activeTasks = filteredTasks.filter(t => t.Status !== 'Closed').map(t => `- [${t.Status}] ${t.Title} (Cost: ${t.Cost || t.Budget || 0}): ${t.Description?.substring(0, 80)}...`).join("\n");
                    const prompt = `ช่วยสรุปงานอุตสาหกรรมเหล่านี้สำหรับผู้บริหาร เน้นวิเคราะห์ความคุ้มค่าของการใช้จ่าย (Cost) และให้ข้อมูลอัปเดตสถานะแบบสั้นๆ: \n${activeTasks}`;
                    const summary = await fetchGemini(prompt, userApiKey, "คุณคือผู้ช่วยสรุปรายงานระดับผู้บริหารและนักวิเคราะห์การเงิน สรุปเนื้อหาเป็นภาษาไทยอย่างกระชับ จัดเรียงให้อ่านง่าย");
                    setAiSummary(summary);
                } catch (error) { 
                    if(error.message === "NO_API_KEY") setShowApiKeyModal(true);
                    else setMsg("AI Error: ไม่สามารถสร้างสรุปผลได้ เช็ค API Key ด้วย"); 
                }
                setIsAiLoading(false);
            };

            const handleSuggestDescription = async () => {
                if (!newItem.Title) { setMsg("กรุณาระบุ Objective หรือ Action Name ก่อน"); return; }
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setIsAiLoading(true);
                try {
                    const prompt = `หัวข้องานคือ "${newItem.Title}" สำหรับสายการผลิต/โรงงาน ค่าใช้จ่ายคร่าวๆ ${newItem.Cost || 'ไม่ระบุ'} บาท ช่วยเขียนคำอธิบายรายละเอียดงาน (Action Detail) ให้ดูเป็นมืออาชีพและชัดเจน ตอบเฉพาะเนื้อหาคำอธิบายเท่านั้น (สั้นๆ กระชับ)`;
                    const suggested = await fetchGemini(prompt, userApiKey, "คุณคือผู้เชี่ยวชาญด้านเอกสารโรงงาน ตอบเป็นภาษาไทย");
                    setNewItem(prev => ({ ...prev, Description: suggested }));
                } catch (error) { 
                    if(error.message === "NO_API_KEY") setShowApiKeyModal(true);
                    else setMsg("AI Error: สร้างคำอธิบายล้มเหลว");

                const file = e.target.files[0]; if (!file) return;
                setSyncProgress("Syncing with Cloud...");
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const cleanText = ev.target.result.replace(/^\uFEFF/, '').trim();
                        const rows = cleanText.split('\n').map(r => r.split(/[;,]/));
                        const hIdx = rows.findIndex(r => r.some(c => String(c).toLowerCase().includes('id')));
                        if (hIdx === -1) throw new Error("Invalid CSV");
                        const headers = rows[hIdx].map(h => h.trim());
                        const idIdx = headers.findIndex(h => h.toLowerCase().includes('id'));
                        const dataRows = rows.slice(hIdx + 1).filter(r => r[idIdx]);
                        const batchLimit = 300; let successCount = 0;
                        for (let i = 0; i < dataRows.length; i += batchLimit) {
                            const chunk = dataRows.slice(i, i + batchLimit);
                            const batch = writeBatch(db);
                            chunk.forEach(r => {
                                const rawId = r[idIdx];
                                const cleanId = String(rawId).toUpperCase().replace(/[^a-zA-Z0-9-]/g, '-').trim();
                                if (cleanId && cleanId.length > 1) {
                                    const obj = { Source: 'SIM2' };
                                    headers.forEach((h, idx) => { if (h && r[idx]) obj[h.replace(/[./*\[\]#$]/g, '_')] = r[idx]; });
                                    const ref = doc(db, ...publicPath, 'actions', cleanId);
                                    batch.set(ref, obj, { merge: true });
                                    successCount++;
                                }
                            });
                            await batch.commit();
                        }
                        await setDoc(doc(db, ...publicPath, 'metadata', 'sync_info'), { lastUpload: new Date().toISOString() }, { merge: true });
                        setMsg(`Sync Complete: ${successCount} Items`);
                    } catch (err) { setMsg("Sync Failed"); }
                    setSyncProgress(null); setTimeout(() => setMsg(null), 3000);
                };
                reader.readAsText(file);
            };

                                                                    if (!t.OpenedAt) up.OpenedAt = new Date().toISOString();
                                                                } else if (next === 'In Progress') {
                                                                    up.OpenedAt = t.OpenedAt || new Date().toISOString();
                                                                    up.ClosedAt = null;
                                                                } else {
                                                                    up.OpenedAt = null;
                                                                    up.ClosedAt = null;
                                                                }
                                                                await setDoc(doc(db, ...publicPath, 'actions', t._id), up, { merge: true });
                                                            }} className="w-full py-3 md:py-4 bg-slate-800 text-white rounded font-bold uppercase italic hover:bg-[#3dcd58] hover:text-white transition-all text-[9px] md:text-[10px] tracking-widest">Cycle Status</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {}
                    {deleteConfirm && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-8 md:p-10 max-w-sm w-full shadow-2xl text-center animate-in border border-slate-100">
                                <h3 className="text-base md:text-lg font-bold uppercase italic text-slate-800 mb-2">Confirm Delete</h3>
                                <p className="text-slate-400 font-medium italic text-[10px] md:text-[11px] mb-8">Permanently remove this action from cloud storage?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-slate-50 text-slate-400 rounded font-bold uppercase text-[10px]">Abort</button>
                                    <button onClick={confirmDelete} className="flex-1 py-3 bg-rose-600 text-white rounded font-bold uppercase text-[10px] shadow-lg shadow-rose-200">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showApiKeyModal && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-6 md:p-10 max-w-md w-full shadow-2xl animate-in border border-slate-100">
                                <h3 className="text-base md:text-lg font-black uppercase italic text-slate-800 mb-2 flex items-center gap-2"><Icon name="Settings" size={18}/> Gemini API Setup</h3>
                                <p className="text-slate-500 font-medium italic text-[10px] md:text-[11px] mb-6 leading-relaxed">
                                    วาง API Key ของคุณที่นี่เพื่อเปิดใช้งานฟีเจอร์ AI Key นี้จะถูกเก็บไว้เฉพาะในเบราว์เซอร์เครื่องนี้เท่านั้น (Local Storage) ปลอดภัยหายห่วงเพื่อน!
                                </p>
                                <input 
                                    type="password" 
                                    placeholder="AIzaSy..." 
                                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:border-[#3dcd58] transition shadow-inner mb-6 font-mono"
                                    value={tempApiKey}
                                    onChange={e => setTempApiKey(e.target.value)}
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setShowApiKeyModal(false)} className="py-3 px-4 bg-slate-100 text-slate-500 rounded font-bold uppercase text-[10px] hover:bg-slate-200 transition">Cancel</button>
                                    <button onClick={clearApiKey} className="py-3 px-4 bg-rose-50 text-rose-500 rounded font-bold uppercase text-[10px] hover:bg-rose-100 transition mr-auto">Clear Key</button>
                                    <button onClick={saveApiKey} className="py-3 px-6 bg-[#3dcd58] text-white rounded font-bold uppercase text-[10px] shadow-lg shadow-[#3dcd58]/30 hover:bg-[#2fa847] transition">Save Key</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        waitForFirebase((fb) => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App fb={fb} />);
        });
    </script>
</body>
</html>
