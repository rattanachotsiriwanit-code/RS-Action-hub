            if (!text) return "";

                return btoa(encodeURIComponent(text).split('').map((c, i) =>

                ).join(''));
            } catch (e) {

        const cleanAndFormatId = (rawId) => {
            if (!rawId) return '';
            let clean = String(rawId).replace(/[\s,'"]/g, '').trim();
            
            if (/^\d+$/.test(clean)) {
                if (clean.length === 9) {
                    return `TASK-${clean.slice(0, 3)}-${clean.slice(3, 6)}-${clean.slice(6)}`;
                }
                if (clean.length === 8) {
                    return `TASK-0${clean.slice(0, 2)}-${clean.slice(2, 5)}-${clean.slice(5)}`;
                }
                return `TASK-${clean}`;
            }
            
            if (/^\d+-\d+-\d+$/.test(clean)) {
                return `TASK-${clean}`;
            }
            
            if (clean.toUpperCase().startsWith("TASK-") || clean.toUpperCase().startsWith("ACT-")) {
                return clean.toUpperCase().replace("ACT-", "TASK-");
            }
            
            return `TASK-${clean.toUpperCase()}`;
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '---';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr; 
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-');
        };

        const fetchGemini = async (prompt, userKey, systemPrompt = "คุณคือผู้ช่วยจัดการโครงการอุตสาหกรรมมืออาชีพ", modelName = "gemini-2.5-flash-preview-09-2025", base64Image = null) => {
            if (!userKey) throw new Error("NO_API_KEY");
            const cleanKey = String(userKey).trim();
            const cleanModel = String(modelName || "gemini-2.5-flash-preview-09-2025").trim();
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            
            let contentsPayload = [];
            if (base64Image) {
                const pureBase64 = base64Image.includes(',') ? base64Image.split(',')[1] : base64Image;
                contentsPayload = [{
                    role: "user",
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: "image/jpeg", data: pureBase64 } }
                    ]
                }];
            } else {
                contentsPayload = [{ parts: [{ text: prompt }] }];
            }

            while (retries < 5) {
                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + cleanModel + ':generateContent?key=' + cleanKey, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: contentsPayload, systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error?.message || `API Error Status ${response.status}`);
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (error) {
                    if (error.message === "NO_API_KEY") throw error;
                    if (retries === 4) throw error;
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }
        };

                                                <li>ตรวจสอบช่อง <span className="text-white">Execute as</span> ต้องเป็น <strong className="text-teal-400">"Me" (อีเมลของคุณ)</strong></li>
                                            </ol>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <FormInput 
                                label="Google Sheets API Web App URL" 
                                val={sheetUrl} 
                                onChange={setSheetUrl} 
                                placeholder="https://script.google.com/macros/s/.../exec" 
                            />
                            <FormInput 
                                label="Operational Username" 
                                val={username} 
                                onChange={setUsername} 
                                placeholder="Username" 
                            />
                            <FormInput 
                                label="Clearance Password" 
                                val={password} 
                                onChange={setPassword} 
                                placeholder="Password" 
                                type="password"
                            />

                            <button 
                                type="submit" 
                                disabled={loading}
                                className="w-full py-3.5 mt-2 bg-gradient-to-r from-teal-500 to-emerald-400 text-slate-950 rounded-xl font-bold uppercase text-xs tracking-wider hover:opacity-95 transition-all duration-200 shadow-lg shadow-teal-500/10 active:scale-[0.98] disabled:opacity-50"
                            >
                                {loading ? "AUTHORIZING WITH SHEET2..." : "UNLOCK CONTROL SYSTEM"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [session, setSession] = useState(safeSessionStorage.getItem('rs_task_session') || null); // 'admin' or 'view_only'
            const [authError, setAuthError] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);

            // 💾 ฐานข้อมูล Local Storage
            const [allData, setAllData] = useState([]);

            // ☁️ Google Sheets API Setup - ฝังลิงก์ Web App หลักของคุณรัตนโชติโดยตรง ป้องกันความยุ่งยาก
            const [sheetUrl, setSheetUrl] = useState(() => {
                const stored = safeLocalStorage.getItem('rs_google_sheet_api_url_enc');
                return stored ? deobfuscate(stored) : 'https://script.google.com/macros/s/AKfycby_1gweigaQeiWTVlEXwrAVZl5KvgcqSy7S-RAkGMznSG9QsS2ElbMpEkZ9u372Roop/exec';
            });
            const [isCloudSyncing, setIsCloudSyncing] = useState(false);
            const [showCorsAlert, setShowCorsAlert] = useState(false); 
            const [cloudDebugInfo, setCloudDebugInfo] = useState(null); 

            const [view, setView] = useState('dashboard');
            const [search, setSearch] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [lineFilter, setLineFilter] = useState('All'); 
            const [sortBy, setSortBy] = useState('default');
            const [expandedId, setExpandedId] = useState(null);
            const [msg, setMsg] = useState(null);
            const [syncProgress, setSyncProgress] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);

            const currentYearValue = 2026;
            const [selectedYear, setSelectedYear] = useState(currentYearValue);

            const [editingCostId, setEditingCostId] = useState(null);
            const [tempCost, setTempCost] = useState('');
            
            const [editingDescId, setEditingDescId] = useState(null);
            const [tempDesc, setTempDesc] = useState('');

            const [editingDueDateId, setEditingDueDateId] = useState(null);
            const [tempDueDate, setTempDueDate] = useState('');

            const [editingAttachmentId, setEditingAttachmentId] = useState(null);
            const [tempAttachment, setTempAttachment] = useState('');
            const [previewUrl, setPreviewUrl] = useState(null);

            // ดึงค่าสิทธิ์การเชื่อมโยง AI
            const [userApiKey, setUserApiKey] = useState(() => {
                const stored = safeLocalStorage.getItem('gemini_api_key_enc');
                return stored ? deobfuscate(stored) : (safeLocalStorage.getItem('gemini_api_key') || '');
            });
            const [selectedModel, setSelectedModel] = useState(() => safeLocalStorage.getItem('gemini_model_selection') || 'gemini-2.5-flash-preview-09-2025');
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [tempApiKey, setTempApiKey] = useState('');
            const [tempModelSelection, setTempModelSelection] = useState(selectedModel);

            // ✨ AI New States
            const [aiSummary, setAiSummary] = useState("");
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiImageAnalysis, setAiImageAnalysis] = useState(null); 
            const [isAiChatOpen, setIsAiChatOpen] = useState(false);
            const [aiChatInput, setChatInput] = useState("");
            const [aiChatHistory, setAiChatHistory] = useState([
                { sender: "ai", text: "สวัสดีครับคุณรัตนโชติ ยินดีต้อนรับสู่ Rattanachot AI Smart Assistant! มีประเด็นทางวิศวกรรม ความคืบหน้าโครงการ หรืออยากให้ผมช่วยร่างเอกสาร 8D / แนะนำ TPM ตรงไหน สอบถามได้เลยครับ ✨" }
            ]);
            const [isChatSending, setIsChatSending] = useState(false);

            const [newItem, setNewItem] = useState({
                'Action Id': '', 'Title': '', 'Description': '', 'Cost': '', 'Opening Date': new Date().toISOString(), 'Due Date': '', 'Closed Date': '', 'Status': 'Open', 'In_Charge': 'Rattanachot Siriwanit', 'Line': '', 'Attachment': '' 
            });

            const isReadOnly = session === 'view_only';

            useEffect(() => {
                if (session) {
                    if (sheetUrl) {
                        pullFromGoogleSheets();
                    } else {
                        const local = safeLocalStorage.getItem('rs_local_actions_db_v3');
                        setAllData(local ? JSON.parse(local) : INITIAL_SAMPLE_DATA);
                    }
                }
            }, [sheetUrl, session]);

            useEffect(() => {
                if (allData && allData.length > 0) {
                    safeLocalStorage.setItem('rs_local_actions_db_v3', JSON.stringify(allData));
                }
            }, [allData]);

            useEffect(() => {
                if (view === 'add') {
                    setNewItem(prev => ({
                        ...prev,
                        'Action Id': generateNextId()
                    }));
                }
            }, [view, allData]);

            const showToast = (txt) => {
                setMsg(txt);
                setTimeout(() => setMsg(null), 3000);
            };

            const isValidUrl = (string) => {
                try {
                    const url = new URL(string.trim());
                    return url.protocol === "http:" || url.protocol === "https:";
                } catch (_) {
                    return false;  
                }
            };

            const pullFromGoogleSheets = async () => {
                const trimmedUrl = String(sheetUrl || '').trim();
                if (!trimmedUrl) return;

                if (!isValidUrl(trimmedUrl)) {
                    showToast("⚠️ รูปแบบลิงก์ Google Sheets ไม่ถูกต้อง");
                    return;
                }

                setIsCloudSyncing(true);
                setShowCorsAlert(false);
                setCloudDebugInfo(null);
                try {
                    const separator = trimmedUrl.includes('?') ? '&' : '?';
                    const response = await fetch(`${trimmedUrl}${separator}action=read&_=${Date.now()}`);
                    if (response.ok) {
                        const cloudData = await response.json();
                        
                        if (cloudData) {
                            setCloudDebugInfo({
                                isArray: Array.isArray(cloudData),
                                length: Array.isArray(cloudData) ? cloudData.length : 0,
                                sampleRow: Array.isArray(cloudData) && cloudData.length > 0 ? cloudData[0] : cloudData,
                                raw: JSON.stringify(cloudData).slice(0, 300) + '...'
                            });
                        }

                        if (Array.isArray(cloudData) && cloudData.length === 0) {
                            setAllData([]); 
                            safeLocalStorage.setItem('rs_local_actions_db_v3', JSON.stringify([]));
                            showToast("ซิงค์สำเร็จ: คลาวด์ว่างเปล่า (ล้างข้อมูลเครื่องทั้งหมดแล้ว)");
                        } else if (Array.isArray(cloudData) && cloudData.length > 0) {
                            const mapped = cloudData.map(row => {
                                const rawActionId = row._id || row['Action Id'] || row['ActionId'] || row['id'] || '';
                                const cleanActionId = cleanAndFormatId(rawActionId);
                                return {
                                    ...row,
                                    _id: cleanActionId,
                                    'Action Id': cleanActionId,
                                    'Title': row.Title || row['title'] || row['Objective'] || 'Untitled',
                                    'Description': row.Description || row['description'] || row['Action Detail'] || '',
                                    'Cost': String(row.Cost || row['cost'] || row['Budget'] || '0'),
                                    'Opening Date': row['Opening Date'] || row['OpeningDate'] || row['OpenedAt'] || new Date().toISOString(),
                                    'Due Date': row['Due Date'] || row['DueDate'] || row['Due Date R/S*'] || '',
                                    'Closed Date': row['Closed Date'] || row['ClosedDate'] || '',
                                    'Status': row.Status || row['status'] || 'Open',
                                    'In_Charge': row.In_Charge || row['In Charge'] || row['InCharge'] || row['Owner'] || row['Responsible'] || 'Rattanachot Siriwanit',
                                    'Line': row.Line || row['line'] || row['Area'] || '',
                                    'Attachment': row.Attachment || row['attachment'] || row['Attachment URL'] || '',
                                    'Note': row.Note || row['note'] || row['Note_Comments'] || '',
                                    'Image': row.Image || row['image'] || '' 
                                };
                            });
                            setAllData(mapped);
                            showToast("อัปเดตข้อมูลสดตรงจาก Google Sheets เรียบร้อย!");
                        } else {
                            showToast("ดึงข้อมูลสำเร็จ แต่ข้อมูลโครงสร้าง JSON ไม่เป็นระเบียบ");
                        }
                    } else {
                        throw new Error(`HTTP Error Status: ${response.status}`);
                    }
                } catch(e) {
                    console.error("Failed to pull from sheets:", e);
                    if (e.name === 'TypeError' || String(e).includes('Failed to fetch')) {
                        setShowCorsAlert(true);
                        showToast("⚠️ ไม่สามารถดึงข้อมูลได้เนื่องจากสิทธิ์ CORS บน Apps Script");
                    } else {
                        showToast(`เชื่อมต่อไม่ได้: ${e.message}`);
                    }
                    
                    const local = safeLocalStorage.getItem('rs_local_actions_db_v3');
                    if (local) {
                        setAllData(JSON.parse(local));
                    }
                }
                setIsCloudSyncing(false);
            };

            const pushToGoogleSheets = async (action, dataPayload) => {
                const trimmedUrl = String(sheetUrl || '').trim();
                if (!trimmedUrl || !isValidUrl(trimmedUrl)) return;

                setIsCloudSyncing(true);
                try {
                    const cleanPayload = { ...dataPayload };
                    
                    if (cleanPayload.Image && cleanPayload.Image.length > 48000) {
                        cleanPayload.Image = cleanPayload.Image.slice(0, 47900);
                    }

                    const payloadToSend = {
                        action: action,
                        data: {
                            'Action Id': cleanAndFormatId(cleanPayload['Action Id'] || cleanPayload._id || ''),
                            'Title': cleanPayload['Title'] || '',
                            'Description': cleanPayload['Description'] || '',
                            'Cost': cleanPayload['Cost'] || '0',
                            'Opening Date': cleanPayload['Opening Date'] || '',
                            'Due Date': cleanPayload['Due Date'] || '',
                            'Closed Date': cleanPayload['Closed Date'] || '',
                            'Status': cleanPayload['Status'] || 'Open',
                            'In_Charge': cleanPayload['In_Charge'] || '',
                            'Line': cleanPayload['Line'] || '',
                            'Attachment': cleanPayload['Attachment'] || '',
                            'Note': cleanPayload['Note'] || '',
                            'Image': cleanPayload.Image || '' 
                        }
                    };

                    await fetch(trimmedUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payloadToSend)
                    });
                    
                    await pullFromGoogleSheets();
                } catch(e) {
                    console.error("Push failed:", e);
                    showToast("⚠️ บันทึกข้อมูลคลาวด์ขัดข้อง แต่บันทึกในเครื่องเรียบร้อย");
                }
                setIsCloudSyncing(false);
            };

            const handleLogin = async (username, password) => {
                setAuthError('');
                const trimmedUrl = String(sheetUrl || '').trim();
                if (!trimmedUrl) {
                    setAuthError('กรุณากรอก Google Sheets API Web App URL ก่อนเข้าสู่ระบบ');
                    return;
                }
                if (!isValidUrl(trimmedUrl)) {
                    setAuthError('รูปแบบลิงก์ Google Sheets Web App URL ไม่ถูกต้อง');
                    return;
                }

                setLoginLoading(true);
                try {
                    const separator = trimmedUrl.includes('?') ? '&' : '?';
                    const targetLoginUrl = `${trimmedUrl}${separator}action=login&username=${encodeURIComponent(username.trim())}&password=${encodeURIComponent(password.trim())}&_=${Date.now()}`;
                    
                    const response = await fetch(targetLoginUrl);
                    if (!response.ok) throw new Error(`HTTP Error Status ${response.status}`);
                    const result = await response.json();

                    if (result && result.success) {
                        const userLevel = result.level === 'admin' ? 'admin' : 'view_only';
                        setSession(userLevel);
                        
                        const readOnlyVal = userLevel === 'view_only';
                        
                        safeSessionStorage.setItem('rs_task_session', userLevel);
                        safeSessionStorage.setItem('rs_task_readonly', String(readOnlyVal));
                        safeLocalStorage.setItem('rs_google_sheet_api_url_enc', obfuscate(trimmedUrl));
                        
                        showToast(`ยินดีต้อนรับเข้าสู่ระบบ ระดับสิทธิ์: ${userLevel.toUpperCase()}`);
                    } else {
                        setAuthError(result.message || 'รหัสพนักงานหรือรหัสผ่านผู้ดูแลระบบควบคุมไม่ถูกต้อง');
                    }
                } catch (e) {
                    console.error("Login fetch crashed: ", e);
                    setAuthError('ไม่สามารถเชื่อมโยงและยืนยันสิทธิ์ได้ โปรดตรวจ Apps Script เผยแพร่เป็นแบบ Anyone หรือไม่');
                } finally {
                    setLoginLoading(false);
                }
            };

            const handleSignOut = () => {
                setSession(null);
                safeSessionStorage.removeItem('rs_task_session');
                safeSessionStorage.removeItem('rs_task_readonly');
                showToast('ออกจากระบบอย่างปลอดภัย');
            };

            const handleUploadCSV = (e) => {
                if (isReadOnly) return;
                const file = e.target.files[0]; if (!file) return;
                setSyncProgress("กำลังสกัดและกรองข้อมูลเฉพาะ Rattanachot...");
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const cleanText = ev.target.result.replace(/^\uFEFF/, '').trim();
                        const delimiter = cleanText.indexOf(';') !== -1 ? ';' : ',';
                        const rows = []; let row = []; let cur = ''; let inQuote = false;
                        for (let i = 0; i < cleanText.length; i++) {
                            const char = cleanText[i];
                            if (char === '"') inQuote = !inQuote;
                            else if (char === delimiter && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                            else if (char === '\n' && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); row = []; cur = ''; }
                            else if (char !== '\r') cur += char;
                        }
                        if (cur || row.length > 0) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); }
                        
                        const hIdx = rows.findIndex(r => r.some(c => String(c).toLowerCase().includes('id')));
                        if (hIdx === -1) {
                            showToast("❌ ไม่พบรูปแบบหัวตารางของ SIM2 CSV");
                            setSyncProgress(null);
                            return;
                        }
                        
                        const headers = rows[hIdx].map(h => h.trim());
                        let idIdx = headers.findIndex(h => h.toLowerCase() === 'action id');
                        if (idIdx === -1) idIdx = headers.findIndex(h => h.toLowerCase().includes('id'));
                        
                        let ownerIdx = headers.findIndex(h => h.toLowerCase() === 'owner');
                        if (ownerIdx === -1) ownerIdx = headers.findIndex(h => h.toLowerCase().includes('owner'));
                        
                        let raiserIdx = headers.findIndex(h => h.toLowerCase() === 'raiser');
                        if (raiserIdx === -1) raiserIdx = headers.findIndex(h => h.toLowerCase().includes('raiser'));

                        const dataRows = rows.slice(hIdx + 1).filter(r => r[idIdx]);
                        let acceptedCount = 0;
                        const updated = [...allData];

                        for (let r of dataRows) {
                            const rawId = String(r[idIdx]);
                            const formattedCleanId = cleanAndFormatId(rawId);
                            
                            const ownerName = ownerIdx !== -1 ? String(r[ownerIdx] || '').toLowerCase() : '';
                            const raiserName = raiserIdx !== -1 ? String(r[raiserIdx] || '').toLowerCase() : '';
                            
                            const isMyTask = ownerName.includes('rattanachot') || 
                                             ownerName.includes('siriwanit') || 
                                             ownerName.includes('รัตนโชติ') || 
                                             ownerName.includes('650194') ||
                                             raiserName.includes('rattanachot') || 
                                             raiserName.includes('siriwanit') || 
                                             raiserName.includes('รัตนโชติ') || 
                                             raiserName.includes('650194');

                            if (formattedCleanId.length > 1 && isMyTask) {
                                acceptedCount++;
                                const obj = { 
                                    _id: formattedCleanId, 
                                    'Action Id': formattedCleanId,
                                    Source: 'SIM2 CSV Import' 
                                };
                                headers.forEach((h, idx) => { 
                                    if (h && r[idx] !== undefined) {
                                        obj[h.replace(/[./*\[\]#$]/g, '_')] = r[idx]; 
                                    } 
                                });
                                
                                const matchIdx = updated.findIndex(t => t._id === formattedCleanId);
                                if (matchIdx !== -1) {
                                    updated[matchIdx] = { ...updated[matchIdx], ...obj };
                                } else {
                                    updated.push(obj);
                                }

                                if (sheetUrl) {
                                    await pushToGoogleSheets('upsert', obj);
                                }
                            }
                        }
                        
                        setAllData(updated);
                        showToast(`สกัดสำเร็จ! นำเข้าเฉพาะงานของ Rattanachot ${acceptedCount} รายการ`);
                    } catch (err) { 
                        console.error(err);
                        showToast("❌ การนำเข้าข้อมูลไฟล์ CSV ขัดข้อง"); 
                    }
                    setSyncProgress(null);
                };
                reader.readAsText(file);
            };

            const availableYearsList = useMemo(() => {
                const years = new Set([currentYearValue, currentYearValue + 1, currentYearValue - 1]);
                allData.forEach(t => {
                    const dateVal = t['Opening Date'] || t.OpenedAt || t['Due Date'];
                    if (dateVal) {
                        const d = new Date(dateVal);
                        if (!isNaN(d.getTime())) {
                            years.add(d.getFullYear());
                        }
                    }
                });
                return Array.from(years).sort((a, b) => b - a);
            }, [allData, currentYearValue]);

            const generateNextId = () => {
                let maxNum = 0;
                const targetYear = selectedYear || 2026;
                const prefix = `TASK-${targetYear}-`;
                if (allData && allData.length > 0) {
                    allData.forEach(t => {
                        const id = String(t['Action Id'] || t._id || '').trim().toUpperCase();
                        if (id.startsWith(prefix)) {
                            const parts = id.split('-'); 
                            if (parts.length === 3) {
                                const numPart = parseInt(parts[2], 10);
                                if (!isNaN(numPart) && numPart > maxNum) {
                                    maxNum = numPart;
                                }
                            }
                        }
                    });
                }
                const nextNum = maxNum + 1;
                return `${prefix}${String(nextNum).padStart(3, '0')}`;
            };

            const myTasksRaw = useMemo(() => {
                return allData.filter(t => {
                    const nameFields = String(
                        t.In_Charge || t.InCharge || t.Owner || t.Raiser || t.Responsible || t.OwnerName || t.Rattanachot || ''
                    ).toLowerCase();
                    return nameFields.includes('rattanachot') || nameFields.includes('siriwanit') || nameFields.includes('รัตนโชติ') || nameFields.includes('650194');
                });
            }, [allData]);

            const myAllTasks = useMemo(() => {
                return myTasksRaw.filter(t => {
                    const statusStr = String(t.Status || '').toLowerCase();
                    const isClosed = statusStr.includes('close') || statusStr.includes('succ');
                    const dateStr = isClosed 
                        ? (t['Closed Date'] || t.ClosedAt || t.ClosedDate || t['Opening Date'] || t.OpenedAt)
                        : (t['Opening Date'] || t.OpenedAt || t['Due Date']);
                    const d = new Date(dateStr);
                    return !isNaN(d.getTime()) && d.getFullYear() === selectedYear;
                });
            }, [myTasksRaw, selectedYear]);

            // ✨ คำนวณจำนวน Active (Open + In Progress) และ Closed ประจำปีงบประมาณที่เลือกปัจจุบัน
            const activeCount = useMemo(() => {
                return myAllTasks.filter(t => {
                    const s = String(t.Status || '').toLowerCase();
                    return !s.includes('close') && !s.includes('succ');
                }).length;
            }, [myAllTasks]);

            const closedCount = useMemo(() => {
                return myAllTasks.filter(t => {
                    const s = String(t.Status || '').toLowerCase();
                    return s.includes('close') || s.includes('succ');
                }).length;
            }, [myAllTasks]);

            const lineOptions = useMemo(() => {
                const counts = {};
                myAllTasks.forEach(t => {
                    const line = t.Line || t.Area || 'Unknown';
                    if (String(t.Status || '').toLowerCase().includes('open')) counts[line] = (counts[line] || 0) + 1;
                });
                return Object.entries(counts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
            }, [myAllTasks]);

            const lineStatsFilters = useMemo(() => {
                const stats = {};
                myAllTasks.forEach(t => {
                    const line = t.Line || t.Area || 'Unknown';
                    if (!stats[line]) stats[line] = { total: 0, unclosed: 0 };
                    stats[line].total += 1;
                    if (!String(t.Status || '').toLowerCase().includes('close') && !String(t.Status || '').toLowerCase().includes('succ')) stats[line].unclosed += 1;
                });
                return Object.entries(stats).map(([name, data]) => ({ name, ...data })).sort((a, b) => b.total - a.total);
            }, [myAllTasks]);

            const filteredTasks = useMemo(() => {
                let tasks = [...myAllTasks];
                if (search) {
                    tasks = tasks.filter(t => Object.values(t).some(v => String(v).toLowerCase().includes(search.toLowerCase())));
                }
                if (statusFilter !== 'All') {
                    const sf = statusFilter.toLowerCase();
                    tasks = tasks.filter(t => {
                         const s = String(t.Status || '').toLowerCase();
                         if (sf === 'in progress') return s.includes('progress');
                         return s.includes(sf);
                    });
                }
                if (lineFilter !== 'All') tasks = tasks.filter(t => (t.Line || t.Area || 'Unknown') === lineFilter);
                return tasks.sort((a, b) => {
                    if (sortBy === 'open_desc') return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);
                    if (sortBy === 'open_asc') return new Date(a['Opening Date'] || a.OpenedAt || 0) - new Date(b['Opening Date'] || b.OpenedAt || 0);
                    const getDue = (t) => { const d = t['Due Date'] || t['Due Date R/S*'] || t.DueDate; return d ? new Date(d).getTime() : null; };
                    if (sortBy === 'due_asc') return (getDue(a) || Infinity) - (getDue(b) || Infinity);
                    if (sortBy === 'due_desc') return (getDue(b) || -Infinity) - (getDue(a) || -Infinity);
                    if (String(a.Status).toLowerCase().includes('closed') && !String(b.Status).toLowerCase().includes('closed')) return 1;
                    if (!String(a.Status).toLowerCase().includes('closed') && String(b.Status).toLowerCase().includes('closed')) return -1;
                    return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);
                });

                        }

                    totalSpent,

                setSyncProgress("กำลังบีบอัดรูปถ่ายหน้างาน...");
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas'); 
                        const MAX_WIDTH = 300; 
                        const MAX_HEIGHT = 300;
                        let width = img.width; 
                        let height = img.height;
                        
                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        
                        canvas.width = width; 
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        
                        let compressionQuality = 0.35;
                        let base64Img = canvas.toDataURL('image/jpeg', compressionQuality);
                        
                        if (base64Img.length > 45000) {
                            compressionQuality = 0.25;
                            base64Img = canvas.toDataURL('image/jpeg', compressionQuality);
                        }

                            shrinkCanvas.width = 180;
                            shrinkCanvas.height = 180;

    <!-- Secure Compilation and Execution Sandbox Engine -->
    <script>
        function compileAndRun() {
            try {
                const rawText = document.getElementById('react-code-holder').textContent;
                const compiled = Babel.transform(rawText, {
                    presets: [
                        ['react', { runtime: 'classic' }] 
                    ]
                }).code;
                
                const scriptNode = document.createElement('script');
                scriptNode.text = compiled;
                document.body.appendChild(scriptNode);
                
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
            } catch (err) {
                console.error("Compilation failed, retrying in 100ms...", err.message);
                setTimeout(compileAndRun, 100);
            }
        }

        window.onload = compileAndRun;
    </script>
