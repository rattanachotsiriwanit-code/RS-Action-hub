    <script>
        window.SIM2_FB = null;
        
        function initFirebaseBridge() {
            if (typeof firebase !== 'undefined') {
                window.SIM2_FB = { 
                    initializeApp: (config) => firebase.initializeApp(config), 
                    getAuth: (app) => firebase.auth(app), 
                    signInAnonymously: (auth) => auth.signInAnonymously(), 
                    signInWithCustomToken: (auth, token) => auth.signInWithCustomToken(token), 
                    onAuthStateChanged: (auth, callback) => auth.onAuthStateChanged(callback), 
                    getFirestore: (app) => firebase.firestore(app), 
                    initializeFirestore: (app, settings) => {
                        const db = firebase.firestore(app);
                        try { if (settings) db.settings(settings); } catch (e) {}
                        return db;
                    }, 
                    collection: (db, ...paths) => db.collection(paths.join('/')), 
                    doc: (db, ...paths) => db.doc(paths.join('/')), 
                    setDoc: (docRef, data, options) => docRef.set(data, options || {}), 
                    deleteDoc: (docRef) => docRef.delete(), 
                    onSnapshot: (ref, next, error) => {
                        return ref.onSnapshot((snap) => {
                            if (snap) {
                                try {
                                    const existsVal = !!snap.exists;
                                    Object.defineProperty(snap, 'exists', {
                                        value: () => existsVal,
                                        configurable: true,
                                        enumerable: true,
                                        writable: true
                                    });
                                } catch (e) {}

                                if (snap.docs && Array.isArray(snap.docs)) {
                                    snap.docs.forEach(docSnap => {
                                        try {
                                            const docExists = !!docSnap.exists;
                                            Object.defineProperty(docSnap, 'exists', {
                                                value: () => docExists,
                                                configurable: true,
                                                enumerable: true,
                                                writable: true
                                            });
                                        } catch (e) {}
                                    });
                                }
                            }
                            next(snap);
                        }, error);
                    }, 
                    writeBatch: (db) => {
                        const batch = db.batch();
                        return {
                            set: (docRef, data, options) => batch.set(docRef, data, options || {}),
                            update: (docRef, data) => batch.update(docRef, data),
                            delete: (docRef) => batch.delete(docRef),
                            commit: () => batch.commit()
                        };
                    } 
                };
            } else {
                setTimeout(initFirebaseBridge, 50);
            }
        }
        initFirebaseBridge();
    </script>

            const delays = [1000, 2000, 4000, 8000, 16000];
            while (retries < 5) {
                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + userKey, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },

                    if (!response.ok) throw new Error(result.error?.message || "API Error");

                    if (error.message === "NO_API_KEY") throw error;
                    if (retries === 4) throw error;

                if (lineFilter !== 'All') tasks = tasks.filter(t => (t.Line || t.Area || 'Unknown') === lineFilter);
                return tasks.sort((a, b) => {

                    if (sortBy === 'open_asc') return new Date(a['Opening Date'] || a.OpenedAt || 0) - new Date(b['Opening Date'] || b.OpenedAt || 0);
                    const getDue = (t) => { const d = t['Due Date'] || t['Due Date R/S*'] || t.DueDate; return d ? new Date(d).getTime() : null; };
                    if (sortBy === 'due_asc') return (getDue(a) || Infinity) - (getDue(b) || Infinity);
                    if (sortBy === 'due_desc') return (getDue(b) || -Infinity) - (getDue(a) || -Infinity);
                    if (String(a.Status).toLowerCase().includes('closed') && !String(b.Status).toLowerCase().includes('closed')) return 1;
                    if (!String(a.Status).toLowerCase().includes('closed') && String(b.Status).toLowerCase().includes('closed')) return -1;
                    return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);

            const dashboardData = useMemo(() => {

                let totalClosed = 0;
                let pendingCount = 0;
                let progressCount = 0;
                let successCount = 0;
                let totalCount = 0;

                myTasksRaw.forEach(t => {
                    const statusStr = String(t.Status || '').toLowerCase();
                    const isClosed = statusStr.includes('close') || statusStr.includes('succ');
                    
                    const dateStr = isClosed

                    const d = new Date(dateStr);
                    if (!isNaN(d.getTime()) && d.getFullYear() === selectedYear) {

                        const month = d.getMonth();

                            } else {

                            }

                        }

                    totalSpent,

            const handleUpload = (e) => {
                if (isReadOnly || !fbUser) return;
                const file = e.target.files[0]; if (!file) return;
                setSyncProgress("Syncing with Cloud...");
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const cleanText = ev.target.result.replace(/^\uFEFF/, '').trim();
                        const delimiter = cleanText.indexOf(';') !== -1 ? ';' : ',';
                        const rows = []; let row = []; let cur = ''; let inQuote = false;
                        for (let i = 0; i < cleanText.length; i++) {
                            const char = cleanText[i];
                            if (char === '"') inQuote = !inQuote;
                            else if (char === delimiter && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                            else if (char === '\n' && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); row = []; cur = ''; }
                            else if (char !== '\r') cur += char;
                        }
                        if (cur || row.length > 0) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); }
                        const hIdx = rows.findIndex(r => r.some(c => String(c).toLowerCase().includes('id')));
                        const headers = rows[hIdx].map(h => h.trim());
                        let idIdx = headers.findIndex(h => h.toLowerCase() === 'action id');
                        if (idIdx === -1) idIdx = headers.findIndex(h => h.toLowerCase().includes('id'));
                        
                        const dataRows = rows.slice(hIdx + 1).filter(r => r[idIdx]);
                        let successCount = 0; const batch = writeBatch(db);
                        dataRows.forEach(r => {
                            const cleanId = String(r[idIdx]).toUpperCase().replace(/[^a-zA-Z0-9-]/g, '-').trim();
                            if (cleanId.length > 1) {
                                const obj = { Source: 'SIM2' };
                                headers.forEach((h, idx) => { if (h && r[idx] !== undefined) obj[h.replace(/[./*\[\]#$]/g, '_')] = r[idx]; });
                                batch.set(doc(db, ...publicPath, 'actions', cleanId), obj, { merge: true });
                                successCount++;
                            }
                        });
                        await batch.commit();
                        await setDoc(doc(db, ...publicPath, 'metadata', 'sync_info'), { lastUpload: new Date().toISOString() }, { merge: true });
                        setMsg('Sync Complete: ' + successCount + ' Items');
                    } catch (err) { setMsg("Sync Failed"); }
                    setSyncProgress(null);
                };
                reader.readAsText(file);

                            <div className="w-12 h-12 bg-gradient-to-tr from-[#00E676] to-[#00b0ff] rounded-xl flex items-center justify-center font-black italic shadow-lg mb-3 shadow-[#00E676]/10">
                                <span className="text-slate-950 text-xl font-bold tracking-tighter">RS</span>

                                            </p>
                                        </div>
                                        <button onClick={handleGenerateSummary} disabled={isAiLoading} className="bg-slate-900 border border-slate-800 text-[#00E676] hover:bg-emerald-950/20 px-5 py-2.5 rounded-lg font-black text-xs flex items-center gap-2 uppercase tracking-widest transition shadow-sm">
                                            <Icon name="Sparkle" size={16} className={isAiLoading ? "animate-spin" : ""} /> AI REPORT
                                        </button>
                                    </div>

                                    {aiSummary && (
                                        <div className="gradient-ai p-6 rounded-xl border border-[#00E676]/20 shadow-2xl animate-in">
                                            <div className="flex items-center gap-2 mb-4 font-black text-white italic uppercase tracking-wider"><Icon name="Sparkle" className="text-[#00E676]"/> AI Operation Insight</div>
                                            <div className="text-xs md:text-sm text-slate-300 leading-relaxed italic whitespace-pre-line font-light">{aiSummary}</div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                        <StatCard label="PENDING" value={dashboardData.stats.open} color="bg-amber-500" />
                                        <StatCard label="ON PROGRESS" value={dashboardData.stats.progress} color="bg-blue-500" />
                                        <StatCard label="SUCCESS" value={dashboardData.stats.closed} color="bg-[#00E676]" />
                                        <StatCard label="TOTAL ACTIONS" value={dashboardData.stats.total} color="bg-purple-600" />
                                    </div>

                                    <div className="bg-[#121824] p-6 md:p-8 rounded-xl border border-slate-800/80 shadow-2xl space-y-8">
                                        <div>
                                            <h4 className="font-black text-white uppercase italic tracking-wider text-sm">Operational Cost Analysis (FY {selectedYear})</h4>
                                        </div>
                                        <div className="flex items-end h-56 gap-2 sm:gap-3 border-b border-slate-850 pb-4 pt-4">
                                            {dashboardData.chart.map((c, i) => (
                                                <div key={i} className="flex-1 flex flex-col items-center group h-full justify-end relative">
                                                    <div className="w-full flex items-end justify-center h-full pb-1">
                                                        <div className={'w-full max-w-[28px] rounded-t-[4px] transition-all duration-500 ' + (c.val > 0 ? 'bg-gradient-to-t from-emerald-950/40 via-emerald-700/60 to-[#00E676]' : 'bg-slate-900/40')} style={{ height: c.height + '%' }}></div>
                                                    </div>
                                                    <div className="text-[9px] md:text-[10px] mt-2 text-slate-500 font-bold uppercase italic tracking-widest">{c.label}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ) : view === 'add' && !isReadOnly ? (
                                <div className="max-w-2xl mx-auto py-4 animate-in">
                                    <div className="bg-[#121824] rounded-xl shadow-2xl border border-slate-800/80 p-6 md:p-10">
                                        <form onSubmit={handleAddItem} className="space-y-4">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <FormInput label="Job ID" val={newItem['Action Id']} onChange={v => setNewItem({...newItem, 'Action Id': v})} placeholder="ID-202X" />
                                                <FormInput label="Objective" val={newItem.Title} onChange={v => setNewItem({...newItem, 'Title': v})} placeholder="Action Name" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] md:text-xs font-black text-slate-400 uppercase italic ml-1 tracking-wider">Action Detail</label>
                                                <textarea className="w-full p-4 bg-slate-900 border border-slate-800 rounded-lg text-xs md:text-sm text-slate-300 outline-none focus:border-[#00E676] transition h-28 font-light italic" placeholder="Job Specifications..." value={newItem.Description} onChange={e => setNewItem({...newItem, Description: e.target.value})} />
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <FormInput label="Cost (THB)" val={newItem.Cost} onChange={v => setNewItem({...newItem, Cost: v})} placeholder="0" />
                                                <FormInput label="Attachment URL" val={newItem.Attachment} onChange={v => setNewItem({...newItem, Attachment: v})} placeholder="https://" />
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] md:text-xs font-black text-slate-400 uppercase italic ml-1 tracking-wider">Line</label>
                                                    <select className="w-full p-3 bg-slate-900 border border-slate-800 rounded-lg text-xs md:text-sm font-bold italic text-slate-300 outline-none focus:border-[#00E676]" value={newItem.Line} onChange={e => setNewItem({...newItem, Line: e.target.value})}>
                                                        <option value="" disabled>-- เลือก Line --</option>
                                                        {MASTER_LINE_NAMES.map(line => <option key={line} value={line}>{line.toUpperCase()}</option>)}
                                                    </select>
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] md:text-xs font-black text-slate-400 uppercase italic ml-1 tracking-wider">Due Date</label>
                                                    <input type="date" className="w-full p-3 bg-slate-900 border border-slate-800 rounded-lg text-xs md:text-sm font-bold text-slate-300 outline-none focus:border-[#00E676]" value={newItem['Due Date'] ? newItem['Due Date'].split('T')[0] : ''} onChange={(e) => setNewItem({...newItem, 'Due Date': e.target.value})} />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] md:text-xs font-black text-slate-400 uppercase italic ml-1 tracking-wider">Status</label>
                                                    <select className="w-full p-3 bg-slate-900 border border-slate-800 rounded-lg text-xs md:text-sm font-bold italic text-slate-300 outline-none focus:border-[#00E676]" value={newItem.Status} onChange={e => setNewItem({...newItem, Status: e.target.value})}>
                                                        <option value="Open">OPEN</option><option value="In Progress">IN PROGRESS</option><option value="Closed">CLOSED</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full py-4 mt-2 bg-gradient-to-r from-emerald-600 to-[#00E676] text-slate-950 rounded-lg font-black uppercase italic shadow-lg hover:opacity-90 transition-all text-xs tracking-widest shadow-[#00E676]/10">COMMIT TO SYSTEM DATABASE</button>
                                        </form>
                                    </div>
                                </div>
                            ) : (
                                <div className="max-w-6xl mx-auto space-y-4 animate-in">
                                    <div className="bg-[#121824] border border-slate-850 rounded-xl overflow-hidden divide-y divide-slate-850 shadow-2xl">
                                        {filteredTasks.length === 0 ? (
                                            <div className="p-12 text-center text-slate-500 font-black italic text-sm uppercase tracking-widest">--- NO ACTIONS DEPLOYED FOR FY {selectedYear} ---</div>
                                        ) : filteredTasks.map(t => (
                                            <div key={t._id} className="flex flex-col">
                                                <div onClick={() => setExpandedId(expandedId === t._id ? null : t._id)} className="p-5 flex items-center justify-between cursor-pointer hover:bg-slate-900/40 transition-colors">
                                                    <h4 className={'text-sm md:text-base font-black italic uppercase truncate ' + (String(t.Status).toLowerCase().includes('close') ? 'text-slate-600 line-through' : 'text-slate-100') + ''}>{t.Title || 'Untitled'}</h4>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {previewUrl && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-[400] flex items-center justify-center p-4" onClick={() => setPreviewUrl(null)}>
                            <img src={previewUrl} className="max-w-full max-h-[85vh] object-contain bg-[#121824] p-3 rounded-xl border border-slate-800" />
                        </div>
                    )}
                </div>
            );
        };
    </script>

    <script>
        (function() {
            function startAppCompilation() {
                try {
                    const rawText = document.getElementById('react-code-holder').textContent;
                    const compiled = Babel.transform(rawText, {
                        presets: ['react'],
                        plugins: [
                            ['transform-react-jsx', { runtime: 'classic' }]
                        ]
                    }).code;
                    
                    const finalScript = document.createElement('script');
                    finalScript.text = compiled;
                    document.body.appendChild(finalScript);
                    
                    waitForFirebase((fb) => {
                        const root = ReactDOM.createRoot(document.getElementById('root'));
                        root.render(React.createElement(App, { fb: fb }));
                    });
                } catch(err) {
                    console.error("Compilation failed:", err.message);
                    setTimeout(startAppCompilation, 100);
                }
            }
            setTimeout(startAppCompilation, 50);
        })();
    </script>
</body>
</html>
