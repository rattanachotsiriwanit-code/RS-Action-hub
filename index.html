    <script>
        window.SIM2_FB = null;
        
        function initFirebaseBridge() {
            if (typeof firebase !== 'undefined') {
                window.SIM2_FB = { 
                    initializeApp: (config) => firebase.initializeApp(config), 
                    getAuth: (app) => firebase.auth(app), 
                    signInAnonymously: (auth) => auth.signInAnonymously(), 
                    signInWithCustomToken: (auth, token) => auth.signInWithCustomToken(token), 
                    onAuthStateChanged: (auth, callback) => auth.onAuthStateChanged(callback), 
                    getFirestore: (app) => firebase.firestore(app), 
                    initializeFirestore: (app, settings) => {
                        const db = firebase.firestore(app);
                        try { if (settings) db.settings(settings); } catch (e) {}
                        return db;
                    }, 
                    collection: (db, ...paths) => db.collection(paths.join('/')), 
                    doc: (db, ...paths) => db.doc(paths.join('/')), 
                    setDoc: (docRef, data, options) => docRef.set(data, options || {}), 
                    deleteDoc: (docRef) => docRef.delete(), 
                    onSnapshot: (ref, next, error) => {
                        return ref.onSnapshot((snap) => {
                            if (snap) {
                                try {
                                    const existsVal = !!snap.exists;
                                    Object.defineProperty(snap, 'exists', {
                                        value: () => existsVal,
                                        configurable: true,
                                        enumerable: true,
                                        writable: true
                                    });
                                } catch (e) {}

                                if (snap.docs && Array.isArray(snap.docs)) {
                                    snap.docs.forEach(docSnap => {
                                        try {
                                            const docExists = !!docSnap.exists;
                                            Object.defineProperty(docSnap, 'exists', {
                                                value: () => docExists,
                                                configurable: true,
                                                enumerable: true,
                                                writable: true
                                            });
                                        } catch (e) {}
                                    });
                                }
                            }
                            next(snap);
                        }, error);
                    }, 
                    writeBatch: (db) => {
                        const batch = db.batch();
                        return {
                            set: (docRef, data, options) => batch.set(docRef, data, options || {}),
                            update: (docRef, data) => batch.update(docRef, data),
                            delete: (docRef) => batch.delete(docRef),
                            commit: () => batch.commit()
                        };
                    } 
                };
            } else {
                setTimeout(initFirebaseBridge, 50);
            }
        }
        initFirebaseBridge();
    </script>

            if (!dateStr) return '---';
            const d = new Date(dateStr);

        const fetchGemini = async (prompt, userKey, systemPrompt = "คุณคือผู้ช่วยจัดการโครงการอุตสาหกรรมมืออาชีพ") => {
            if (!userKey) throw new Error("NO_API_KEY");
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            while (retries < 5) {
                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + userKey, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error?.message || "API Error");
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (error) {
                    if (error.message === "NO_API_KEY") throw error;
                    if (retries === 4) throw error;
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }

                });
                return Object.entries(stats).map(([name, data]) => ({ name, ...data })).sort((a, b) => b.total - a.total);
            }, [myAllTasks]);

            const filteredTasks = useMemo(() => {
                let tasks = [...myAllTasks];
                if (search) {
                    tasks = tasks.filter(t => Object.values(t).some(v => String(v).toLowerCase().includes(search.toLowerCase())));
                }
                if (statusFilter !== 'All') {
                    const sf = statusFilter.toLowerCase();
                    tasks = tasks.filter(t => {
                         const s = String(t.Status || '').toLowerCase();
                         if (sf === 'in progress') return s.includes('progress');

                    });
                }
                if (lineFilter !== 'All') tasks = tasks.filter(t => (t.Line || t.Area || 'Unknown') === lineFilter);
                return tasks.sort((a, b) => {
                    if (sortBy === 'open_desc') return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);
                    if (sortBy === 'open_asc') return new Date(a['Opening Date'] || a.OpenedAt || 0) - new Date(b['Opening Date'] || b.OpenedAt || 0);
                    const getDue = (t) => { const d = t['Due Date'] || t['Due Date R/S*'] || t.DueDate; return d ? new Date(d).getTime() : null; };
                    if (sortBy === 'due_asc') return (getDue(a) || Infinity) - (getDue(b) || Infinity);
                    if (sortBy === 'due_desc') return (getDue(b) || -Infinity) - (getDue(a) || -Infinity);
                    if (String(a.Status).toLowerCase().includes('closed') && !String(b.Status).toLowerCase().includes('closed')) return 1;
                    if (!String(a.Status).toLowerCase().includes('closed') && String(b.Status).toLowerCase().includes('closed')) return -1;
                    return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);
                });
            }, [myAllTasks, search, statusFilter, lineFilter, sortBy]);

            const dashboardData = useMemo(() => {
                const months = Array(12).fill(0);
                const openCounts = Array(12).fill(0);
                const closedCounts = Array(12).fill(0);
                let totalSpent = 0;
                let totalClosed = 0;
                let pendingCount = 0;
                let progressCount = 0;
                let successCount = 0;
                let totalCount = 0;

                myTasksRaw.forEach(t => {
                    const statusStr = String(t.Status || '').toLowerCase();
                    const isClosed = statusStr.includes('close') || statusStr.includes('succ');
                    
                    const dateStr = isClosed 
                        ? (t.ClosedAt || t.ClosedDate || t['Opening Date'] || t.OpenedAt)
                        : (t['Opening Date'] || t.OpenedAt || t['Due Date']);
                    
                    const d = new Date(dateStr);
                    if (!isNaN(d.getTime()) && d.getFullYear() === selectedYear) {
                        totalCount++;
                        const month = d.getMonth();
                        
                        if (isClosed) {
                            successCount++;
                            closedCounts[month] += 1;
                            totalClosed += 1;
                            
                            const cost = parseFloat(String(t.Cost || t.Budget || '0').replace(/,/g, "")) || 0;
                            if (cost > 0) {
                                months[month] += cost;
                                totalSpent += cost;
                            }
                        } else {
                            if (statusStr.includes('progress')) {
                                progressCount++;
                            } else {
                                pendingCount++;
                            }
                            openCounts[month] += 1;
                        }
                    }
                });

                const maxCostVal = Math.max(...months, 1);
                const monthNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                
                const chart = months.map((val, idx) => ({
                    label: monthNames[idx],
                    val,
                    openCount: openCounts[idx],
                    closedCount: closedCounts[idx],
                    height: val > 0 ? Math.max((val / maxCostVal) * 100, 4) : 0
                }));

                return {
                    chart,
                    totalSpent,
                    totalClosed,
                    stats: {
                        total: totalCount,
                        open: pendingCount,
                        progress: progressCount,
                        closed: successCount
                    }
                };
            }, [myTasksRaw, selectedYear]);

            const saveApiKey = () => { localStorage.setItem('gemini_api_key', tempApiKey); setUserApiKey(tempApiKey); setShowApiKeyModal(false); setMsg("บันทึก Gemini API Key แล้ว!"); };

                    setMsg(`อัปเดตสถานะเป็น ${newStatus} เรียบร้อย!`);

                    setMsg("ล้มเหลวในการอัปเดตสถานะ");

            };

            const handleGenerateSummary = async () => {
                if (myAllTasks.length === 0) return;
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setIsAiLoading(true);
                try {
                    let dataForAi = "";
                    const openTasks = myAllTasks.filter(t => String(t.Status || '').toLowerCase().includes('open') || String(t.Status || '').toLowerCase().includes('progress'));
                    const lineAnalysis = {};
                    openTasks.forEach(t => {
                        const line = t.Line || t.Area || 'Unknown';
                        if (!lineAnalysis[line]) lineAnalysis[line] = { count: 0, actions: [] };
                        lineAnalysis[line].count += 1;
                        lineAnalysis[line].actions.push('- [ ' + t.Status + ' ] ' + t.Title);
                    });
                    Object.entries(lineAnalysis).sort((a,b)=>b[1].count-a[1].count).slice(0,5).forEach(([line, data]) => {
                        dataForAi += 'Line: ' + line + ' (' + data.count + ' items):\n' + data.actions.join('\n') + '\n\n';
                    });
                    const summary = await fetchGemini('ข้อมูลงานค้างหน้างานทั้งหมด:\n\n' + dataForAi + '\nแนะนำวิธีแก้ปัญหาเทคนิค 3 ข้อสั้นๆ ให้วิศวกรโรงงานเดินไปทำได้จริงทันที ไม่เน้นทฤษฎี', userApiKey);
                    setAiSummary(summary);
                } catch (error) { setMsg("AI Summary Error"); }
                setIsAiLoading(false);
            };

            const handleSuggestDescription = async () => {
                if (!newItem.Title) { setMsg("กรุณาระบุหัวข้อมหรืองานก่อนครับพี่บอล"); return; }

                setIsAiLoading(true);

                setIsAiLoading(false);

            const handleUpload = (e) => {
                if (isReadOnly || !fbUser) return;
                const file = e.target.files[0]; if (!file) return;
                setSyncProgress("กำลังดึงและแปลงไฟล์สเปรดชีต...");
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const cleanText = ev.target.result.replace(/^\uFEFF/, '').trim();
                        const delimiter = cleanText.indexOf(';') !== -1 ? ';' : ',';
                        const rows = []; let row = []; let cur = ''; let inQuote = false;
                        for (let i = 0; i < cleanText.length; i++) {
                            const char = cleanText[i];
                            if (char === '"') inQuote = !inQuote;
                            else if (char === delimiter && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                            else if (char === '\n' && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); row = []; cur = ''; }
                            else if (char !== '\r') cur += char;
                        }
                        if (cur || row.length > 0) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); }
                        const hIdx = rows.findIndex(r => r.some(c => String(c).toLowerCase().includes('id')));
                        const headers = rows[hIdx].map(h => h.trim());
                        let idIdx = headers.findIndex(h => h.toLowerCase() === 'action id');
                        if (idIdx === -1) idIdx = headers.findIndex(h => h.toLowerCase().includes('id'));
                        
                        const dataRows = rows.slice(hIdx + 1).filter(r => r[idIdx]);
                        let successCount = 0; const batch = writeBatch(db);
                        dataRows.forEach(r => {
                            const cleanId = String(r[idIdx]).toUpperCase().replace(/[^a-zA-Z0-9-]/g, '-').trim();
                            if (cleanId.length > 1) {
                                const obj = { Source: 'SIM2' };
                                headers.forEach((h, idx) => { if (h && r[idx] !== undefined) obj[h.replace(/[./*\[\]#$]/g, '_')] = r[idx]; });
                                batch.set(doc(db, ...publicPath, 'actions', cleanId), obj, { merge: true });
                                successCount++;
                            }
                        });
                        await batch.commit();
                        await setDoc(doc(db, ...publicPath, 'metadata', 'sync_info'), { lastUpload: new Date().toISOString() }, { merge: true });
                        setMsg('ซิงค์ข้อมูลลงฐานข้อมูลกลางสำเร็จ: ' + successCount + ' งาน');
                    } catch (err) { setMsg("ซิงค์ไฟล์ผิดพลาด"); }
                    setSyncProgress(null);
                };
                reader.readAsText(file);
            };

            const handleAddItem = async (e) => {

                if (isReadOnly) return;
                
                if (!fbUser) { setMsg("กำลังเชื่อมต่อไปยังฐานข้อมูลคลาวด์..."); return; }
                if (!newItem['Action Id'] || !newItem.Title || !newItem.Line) { setMsg("ข้อมูลไม่ครบถ้วน! กรุณากรอก ID, ชื่องาน, และเลือกไลน์การผลิต"); return; }

                setSyncProgress("กำลังสร้างคำสั่งงานใหม่...");

                    const defaultDueDate = new Date(); 
                    defaultDueDate.setDate(defaultDueDate.getDate() + 7);
                    const finalDueDate = newItem['Due Date'] ? new Date(newItem['Due Date']).toISOString() : defaultDueDate.toISOString();
                    
                    await setDoc(doc(db, ...publicPath, 'actions', cleanId), { 
                        ...newItem,

                        'Action Id': cleanId, 
                        editCount: 0

                    setMsg("เพิ่มงานสำเร็จแล้วครับ!");
                    setNewItem({

                        'Title': '', 
                        'Description': '', 
                        'Cost': '', 
                        'Opening Date': new Date().toISOString(), 
                        'Due Date': '', 
                        'Status': 'Open', 
                        'In_Charge': 'Rattanachot Siriwanit', 
                        'Line': '', 
                        'Attachment': '' 
                    });
                    setView('list');
                } catch (e) { 
                    console.error("Failed to set doc:", e);
                    setMsg("บันทึกข้อมูลล้มเหลว: " + e.message); 
                }
                setSyncProgress(null);
            };

            const confirmDelete = async () => { if (isReadOnly || !fbUser) return; await deleteDoc(doc(db, ...publicPath, 'actions', deleteConfirm.id)); setMsg("ลบงานสำเร็จเรียบร้อย"); setDeleteConfirm(null); };
            const saveCostEdit = async (id) => { if (isReadOnly || !fbUser) return; await setDoc(doc(db, ...publicPath, 'actions', id), { Cost: tempCost }, { merge: true }); setEditingCostId(null); setMsg("อัปเดตราคาเป้าหมายแล้ว"); };
            const saveDescEdit = async (t) => { if (isReadOnly || !fbUser) return; await setDoc(doc(db, ...publicPath, 'actions', t._id), { Description: tempDesc, editCount: (t.editCount || 0) + 1 }, { merge: true }); setEditingDescId(null); setMsg("แก้ไขคำอธิบายงานแล้ว"); };
            const saveDueDateEdit = async (t) => { if (isReadOnly || !fbUser) return; await setDoc(doc(db, ...publicPath, 'actions', t._id), { 'Due Date': tempDueDate ? new Date(tempDueDate).toISOString() : '', dueDateEditCount: (t.dueDateEditCount || 0) + 1 }, { merge: true }); setEditingDueDateId(null); setMsg("ขยายกำหนดการเสร็จสิ้นแล้ว"); };
            const saveAttachmentEdit = async (t) => { if (isReadOnly || !fbUser) return; await setDoc(doc(db, ...publicPath, 'actions', t._id), { Attachment: tempAttachment }, { merge: true }); setEditingAttachmentId(null); setMsg("แนบลิงก์เอกสารอัปเดตแล้ว"); };

            const handleImageUpload = (e, id) => {
                if (isReadOnly || !fbUser) return;
                const file = e.target.files[0]; if (!file) return;
                setSyncProgress("กำลังบันทึกภาพหน้างานลงฐานข้อมูล...");
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 800; let scaleSize = 1;
                        if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                        canvas.width = img.width * scaleSize; canvas.height = img.height * scaleSize;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        try {
                            await setDoc(doc(db, ...publicPath, 'actions', id), { Image: canvas.toDataURL('image/jpeg', 0.7) }, { merge: true });
                            setMsg("อัปโหลดและผูกรูปกับงานเรียบร้อย!");
                        } catch(err) { setMsg("อัปโหลดผิดพลาด"); }
                        setSyncProgress(null);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="flex h-screen bg-[#080b11] relative overflow-hidden font-['Prompt'] text-slate-100 select-none">
                    {/* Sidebar สำหรับ Mobile */}
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[25] md:hidden" onClick={() => setIsSidebarOpen(false)} />}

                    <aside className={`fixed md:relative inset-y-0 left-0 w-64 bg-[#0c0f16] flex flex-col shrink-0 z-30 border-r border-slate-900 transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-8 flex flex-col items-center text-center relative border-b border-slate-900">
                            <button onClick={() => setIsSidebarOpen(false)} className="absolute top-4 right-4 text-slate-500 md:hidden hover:text-white"><Icon name="X" size={24} /></button>
                            <div className="w-12 h-12 bg-gradient-to-tr from-[#00E676] to-[#00b0ff] rounded-xl flex items-center justify-center font-black italic shadow-lg mb-3 shadow-[#00E676]/10">
                                <span className="text-slate-950 text-xl font-bold tracking-tighter">RS</span>
                            </div>
                            <h1 className="font-black italic uppercase tracking-widest text-white text-md leading-none">Rattanachot Task</h1>
                            <span className={'text-[9px] font-black uppercase tracking-wider mt-2 px-2.5 py-1 rounded-md border border-slate-800 ' + (isReadOnly ? 'text-blue-400 bg-blue-950/20 border-blue-900/30' : 'text-[#00E676] bg-emerald-950/20 border-emerald-900/30')}>
                                {isReadOnly ? 'READ-ONLY GUEST' : 'SECURE ADMIN'}
                            </span>

                        <nav className="flex-1 py-6 px-2 space-y-1">
                            <SidebarBtn icon={<Icon name="Dashboard" />} label="แดชบอร์ดภาพรวม" active={view === 'dashboard'} onClick={() => setView('dashboard')} />
                            <SidebarBtn icon={<Icon name="List" />} label="รายการงานทั้งหมด" active={view === 'list'} onClick={() => setView('list')} />
                            {!isReadOnly && <SidebarBtn icon={<Icon name="Plus" />} label="เพิ่มงานแมนนวล" active={view === 'add'} onClick={() => setView('add')} />}
                        </nav>

                        {/* Fiscal Year Controller */}

                                <Icon name="Calendar" size={12} className="text-[#00E676]" /> ปีงบประมาณ (Fiscal Year)
                            </span>

                                    value={selectedYear}

                                        setSelectedYear(Number(e.target.value));

                                                                        </div>
                                                                    )}

                                                                    {/* แผงแสดงค่า Cost */}
                                                                    <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-800/80">
                                                                        <div className="flex justify-between items-center mb-2">
                                                                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider">งบประมาณดำเนินงาน (COST)</span>
                                                                            {!isReadOnly && editingCostId !== t._id && (
                                                                                <button onClick={() => setEditingCostId(t._id)} className="text-[10px] text-blue-400 font-bold hover:underline">แก้ไขงบ</button>
                                                                            )}
                                                                        </div>
                                                                        {editingCostId === t._id ? (
                                                                            <div className="space-y-2">
                                                                                <input className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-100 text-xs font-bold" value={tempCost} onChange={e => setTempCost(e.target.value)} />
                                                                                <div className="flex gap-2">
                                                                                    <button onClick={() => saveCostEdit(t._id)} className="bg-[#00E676] text-black px-2.5 py-1 rounded font-bold text-[10px]">บันทึก</button>
                                                                                    <button onClick={() => setEditingCostId(null)} className="bg-slate-800 px-2.5 py-1 rounded text-[10px]">ยกเลิก</button>
                                                                                </div>
                                                                            </div>
                                                                        ) : (
                                                                            <p className="text-base font-black text-white italic tracking-wider tabular-nums">{t.Cost ? parseFloat(String(t.Cost).replace(/,/g, '')).toLocaleString() + ' บาท' : '---'}</p>
                                                                        )}
                                                                    </div>

                                                                    {/* กำหนดเสร็จงาน (Due Date) */}
                                                                    <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-800/80">
                                                                        <div className="flex justify-between items-center mb-2">
                                                                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider">กำหนดส่งเสร็จสิ้น (DUE DATE)</span>
                                                                            {!isReadOnly && editingDueDateId !== t._id && (
                                                                                <button onClick={() => setEditingDueDateId(t._id)} className="text-[10px] text-blue-400 font-bold hover:underline">เปลี่ยนวัน</button>
                                                                            )}
                                                                        </div>
                                                                        {editingDueDateId === t._id ? (
                                                                            <div className="space-y-2">
                                                                                <input type="date" className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-100 text-xs font-bold" value={tempDueDate} onChange={e => setTempDueDate(e.target.value)} />
                                                                                <div className="flex gap-2">
                                                                                    <button onClick={() => saveDueDateEdit(t)} className="bg-[#00E676] text-black px-2.5 py-1 rounded font-bold text-[10px]">บันทึก</button>
                                                                                    <button onClick={() => setEditingDueDateId(null)} className="bg-slate-800 px-2.5 py-1 rounded text-[10px]">ยกเลิก</button>
                                                                                </div>
                                                                            </div>
                                                                        ) : (
                                                                            <p className="text-sm font-bold text-slate-200 tabular-nums">{formatDate(t['Due Date'] || t.DueDate)}</p>
                                                                        )}
                                                                    </div>

                                                                    {/* ลิงก์อ้างอิงเอกสารแนบประกอบ */}
                                                                    <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-800/80">
                                                                        <div className="flex justify-between items-center mb-2">
                                                                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider">เอกสารแนบอ้างอิง</span>
                                                                            {!isReadOnly && editingAttachmentId !== t._id && (
                                                                                <button onClick={() => setEditingAttachmentId(t._id)} className="text-[10px] text-blue-400 font-bold hover:underline">แก้ไขลิงก์</button>
                                                                            )}
                                                                        </div>
                                                                        {editingAttachmentId === t._id ? (
                                                                            <div className="space-y-2">
                                                                                <input className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-100 text-xs" value={tempAttachment} onChange={e => setTempAttachment(e.target.value)} placeholder="https://..." />
                                                                                <div className="flex gap-2">
                                                                                    <button onClick={() => saveAttachmentEdit(t)} className="bg-[#00E676] text-black px-2.5 py-1 rounded font-bold text-[10px]">บันทึก</button>
                                                                                    <button onClick={() => setEditingAttachmentId(null)} className="bg-slate-800 px-2.5 py-1 rounded text-[10px]">ยกเลิก</button>
                                                                                </div>
                                                                            </div>
                                                                        ) : (
                                                                            t.Attachment ? (
                                                                                <a href={t.Attachment} target="_blank" rel="noopener noreferrer" className="text-xs text-[#00E676] font-bold underline flex items-center gap-1 hover:text-[#00c853] break-all">
                                                                                    <Icon name="Cloud" size={12} /> {t.Attachment}
                                                                                </a>
                                                                            ) : (
                                                                                <p className="text-xs text-slate-500 font-bold uppercase">ไม่มีการแนบลิงก์เอกสาร</p>
                                                                            )
                                                                        )}
                                                                    </div>

                                                                    {/* ผู้ดูแลรับผิดชอบหลัก */}
                                                                    <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-800/80">
                                                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">ผู้รับผิดชอบงานปฏิบัติงาน (RESPONSIBLE)</span>
                                                                        <p className="text-xs font-bold text-slate-200">{t.In_Charge || 'รัตนโชติ ศิริวาณิชย์ (Rattanachot)'}</p>
                                                                    </div>

                                                                    {/* ปุ่มลบงาน (ถ้ามีสิทธิ์) */}
                                                                    {!isReadOnly && (
                                                                        <button 
                                                                            onClick={() => setDeleteConfirm({ id: t._id, title: t.Title })} 
                                                                            className="w-full py-2.5 border border-rose-900/40 hover:bg-rose-950/20 text-rose-500 rounded-lg font-black uppercase text-[10px] transition active:scale-95"
                                                                        >
                                                                            ลบงานนี้ออก (REMOVE ACTION)
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* หน้าต่างยืนยันลบงาน (Delete Confirmation Modal) */}
                    {deleteConfirm && (
                        <div className="fixed inset-0 z-[500] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-[#0c0f16] border border-rose-900/50 p-8 rounded-2xl max-w-md w-full shadow-2xl relative text-center">
                                <h4 className="text-lg font-black text-white uppercase italic tracking-wider mb-2">ยืนยันลบคำสั่งงานนี้ใช่หรือไม่?</h4>
                                <p className="text-xs text-slate-400 mb-6 font-bold leading-relaxed">งานหัวข้อ "{deleteConfirm.title}" จะถูกเอาออกอย่างถาวรจากฐานข้อมูลกลาง</p>
                                <div className="flex gap-4">
                                    <button onClick={confirmDelete} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-black uppercase text-xs rounded-lg active:scale-95 transition">ยืนยันลบ</button>
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-slate-900 hover:bg-slate-850 text-slate-300 font-bold uppercase text-xs rounded-lg active:scale-95 transition border border-slate-800">ยกเลิก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* หน้าต่างตั้งค่า API Key คอนโทรลเลอร์ (API settings) */}
                    {showApiKeyModal && (
                        <div className="fixed inset-0 z-[500] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-[#0c0f16] border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl relative">
                                <button onClick={() => setShowApiKeyModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white"><Icon name="X" size={20} /></button>
                                <h4 className="text-sm font-black text-white uppercase italic tracking-wider mb-2 flex items-center gap-1.5"><Icon name="Settings" className="text-[#00E676]" /> พอร์ตเชื่อมต่อ Gemini AI API Key</h4>
                                <p className="text-[10px] text-slate-500 mb-6 font-bold uppercase">กรอกกุญแจ API ในการเชื่อมต่อระบบวิเคราะห์สรุปและเสนอแนะปฏิบัติการ</p>
                                <div className="space-y-4">
                                    <FormInput label="Gemini API Key" val={tempApiKey} onChange={setTempApiKey} placeholder="AIzaSy..." />
                                    <div className="flex gap-3 pt-2">
                                        <button onClick={saveApiKey} className="flex-1 py-3 bg-[#00E676] text-black font-black uppercase text-xs rounded-lg active:scale-95 transition">บันทึกคีย์</button>
                                        <button onClick={clearApiKey} className="py-3 px-4 bg-slate-900 hover:bg-slate-850 text-slate-500 font-bold uppercase text-xs rounded-lg active:scale-95 transition border border-slate-800">เคลียร์คีย์</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* พรีวิวภาพใหญ่ (Large Image Preview) */}
                    {previewUrl && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[400] flex items-center justify-center p-4" onClick={() => setPreviewUrl(null)}>
                            <img src={previewUrl} className="max-w-full max-h-[85vh] object-contain bg-[#121824] p-3 rounded-xl border border-slate-800" />
                        </div>
                    )}
                </div>
            );
        };
    </script>

    <script>
        (function() {
            function startAppCompilation() {
                try {
                    const rawText = document.getElementById('react-code-holder').textContent;
                    const compiled = Babel.transform(rawText, {
                        presets: ['react'],
                        plugins: [
                            ['transform-react-jsx', { runtime: 'classic' }]
                        ]
                    }).code;
                    
                    const finalScript = document.createElement('script');
                    finalScript.text = compiled;
                    document.body.appendChild(finalScript);
                    
                    waitForFirebase((fb) => {
                        const root = ReactDOM.createRoot(document.getElementById('root'));
                        root.render(React.createElement(App, { fb: fb }));
                    });
                } catch(err) {
                    console.error("Compilation failed:", err.message);
                    setTimeout(startAppCompilation, 100);
                }
            }
            setTimeout(startAppCompilation, 50);
        })();
    </script>
</body>
</html>
