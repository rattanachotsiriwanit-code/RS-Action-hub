    <script>
        window.SIM2_FB = null;
        function initFirebaseBridge() {
            if (typeof firebase !== 'undefined') {
                window.SIM2_FB = { 
                    initializeApp: (config) => firebase.initializeApp(config), 
                    getAuth: (app) => firebase.auth(app), 
                    signInAnonymously: (auth) => auth.signInAnonymously(), 
                    signInWithCustomToken: (auth, token) => auth.signInWithCustomToken(token), 
                    onAuthStateChanged: (auth, callback) => auth.onAuthStateChanged(callback), 
                    getFirestore: (app) => firebase.firestore(app), 
                    initializeFirestore: (app, settings) => { const db = firebase.firestore(app); try { if (settings) db.settings(settings); } catch (e) {} return db; }, 
                    collection: (db, ...paths) => db.collection(paths.join('/')), 
                    doc: (db, ...paths) => db.doc(paths.join('/')), 
                    setDoc: (docRef, data, options) => docRef.set(data, options || {}), 
                    deleteDoc: (docRef) => docRef.delete(), 
                    onSnapshot: (ref, next, error) => {
                        return ref.onSnapshot((snap) => {
                            if (snap) {
                                try {
                                    const existsVal = !!snap.exists;
                                    Object.defineProperty(snap, 'exists', { value: () => existsVal, configurable: true, enumerable: true, writable: true });
                                } catch (e) {}
                                if (snap.docs && Array.isArray(snap.docs)) {
                                    snap.docs.forEach(docSnap => {
                                        try {
                                            const docExists = !!docSnap.exists;
                                            Object.defineProperty(docSnap, 'exists', { value: () => docExists, configurable: true, enumerable: true, writable: true });
                                        } catch (e) {}
                                    });
                                }
                            }
                            next(snap);
                        }, error);
                    }, 
                    writeBatch: (db) => {
                        const batch = db.batch();
                        return { set: (docRef, data, options) => batch.set(docRef, data, options || {}), update: (docRef, data) => batch.update(docRef, data), delete: (docRef) => batch.delete(docRef), commit: () => batch.commit() };
                    } 
                };
            } else { setTimeout(initFirebaseBridge, 50); }
        }
        initFirebaseBridge();
    </script>

            const db = initializeFirestore(app, {});
            const [session, setSession] = useState(sessionStorage.getItem('rs_task_session') || null);
            const [allData, setAllData] = useState([]);

            useEffect(() => {

            const filteredTasks = useMemo(() => allData.filter(t => {
