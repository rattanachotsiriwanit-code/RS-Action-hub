    <script>
        window.SIM2_FB = null;
        
        function initFirebaseBridge() {
            if (typeof firebase !== 'undefined') {
                window.SIM2_FB = { 
                    initializeApp: (config) => firebase.initializeApp(config), 
                    getAuth: (app) => firebase.auth(app), 
                    signInAnonymously: (auth) => auth.signInAnonymously(), 
                    signInWithCustomToken: (auth, token) => auth.signInWithCustomToken(token), 
                    onAuthStateChanged: (auth, callback) => auth.onAuthStateChanged(callback), 
                    getFirestore: (app) => firebase.firestore(app), 
                    initializeFirestore: (app, settings) => {
                        const db = firebase.firestore(app);
                        try { if (settings) db.settings(settings); } catch (e) {}
                        return db;
                    }, 
                    collection: (db, ...paths) => db.collection(paths.join('/')), 
                    doc: (db, ...paths) => db.doc(paths.join('/')), 
                    setDoc: (docRef, data, options) => docRef.set(data, options || {}), 
                    deleteDoc: (docRef) => docRef.delete(), 
                    onSnapshot: (ref, next, error) => {
                        return ref.onSnapshot((snap) => {
                            if (snap) {
                                try {
                                    const existsVal = !!snap.exists;
                                    Object.defineProperty(snap, 'exists', {
                                        value: () => existsVal,
                                        configurable: true,
                                        enumerable: true,
                                        writable: true
                                    });
                                } catch (e) {}

                                if (snap.docs && Array.isArray(snap.docs)) {
                                    snap.docs.forEach(docSnap => {
                                        try {
                                            const docExists = !!docSnap.exists;
                                            Object.defineProperty(docSnap, 'exists', {
                                                value: () => docExists,
                                                configurable: true,
                                                enumerable: true,
                                                writable: true
                                            });
                                        } catch (e) {}
                                    });
                                }
                            }
                            next(snap);
                        }, error);
                    }, 
                    writeBatch: (db) => {
                        const batch = db.batch();
                        return {
                            set: (docRef, data, options) => batch.set(docRef, data, options || {}),
                            update: (docRef, data) => batch.update(docRef, data),
                            delete: (docRef) => batch.delete(docRef),
                            commit: () => batch.commit()
                        };
                    } 
                };
            } else {
                setTimeout(initFirebaseBridge, 50);
            }
        }
        initFirebaseBridge();
    </script>

        const formatDate = (dateStr) => {
            if (!dateStr) return '---';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr; 
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-');
        };

        const formatYearStyle = (dateStr) => {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return null;
            const year = d.getFullYear();
            const currentYear = 2026;
            const isOld = year < currentYear;
            const formatted = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }).replace(/ /g, '-');
            
            return (
                <span>

        const calculateDays = (start, end) => {
            if (!start || !end) return '---';
            const diff = new Date(end) - new Date(start);
            return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24))) + ' วัน';
        };

        const GEMINI_MODEL = "gemini-3.1-flash-lite";
        
        const fetchGemini = async (prompt, userKey, systemPrompt = "คุณคือผู้ช่วยจัดการโครงการอุตสาหกรรมมืออาชีพ") => {
            if (!userKey) throw new Error("NO_API_KEY");
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            while (retries < 5) {
                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + userKey, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error?.message || "API Error");
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (error) {
                    if (error.message === "NO_API_KEY") throw error;
                    if (retries === 4) throw error;
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }
        };

            const filteredTasks = useMemo(() => {

                    if (sortBy === 'due_asc') return (getDue(a) || Infinity) - (getDue(b) || Infinity);
                    if (sortBy === 'due_desc') return (getDue(b) || -Infinity) - (getDue(a) || -Infinity);
                    if (String(a.Status).toLowerCase().includes('closed') && !String(b.Status).toLowerCase().includes('closed')) return 1;
                    if (!String(a.Status).toLowerCase().includes('closed') && String(b.Status).toLowerCase().includes('closed')) return -1;

                        lineAnalysis[line].count += 1;
                        lineAnalysis[line].actions.push('- [ ' + t.Status + ' ] ' + t.Title);
                    });
                    Object.entries(lineAnalysis).sort((a,b)=>b[1].count-a[1].count).slice(0,5).forEach(([line, data]) => {

                        const cleanText = ev.target.result.replace(/^\uFEFF/, '').trim();
                        const delimiter = cleanText.indexOf(';') !== -1 ? ';' : ',';
                        const rows = []; let row = []; let cur = ''; let inQuote = false;
                        for (let i = 0; i < cleanText.length; i++) {
                            const char = cleanText[i];
                            if (char === '"') inQuote = !inQuote;
                            else if (char === delimiter && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                            else if (char === '\n' && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); row = []; cur = ''; }
                            else if (char !== '\r') cur += char;
                        }
                        if (cur || row.length > 0) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); }

                                        <select className="p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-xs font-black italic text-slate-300 focus:border-[#00E676] outline-none" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                                            <option value="default">SORT: DEFAULT</option>
                                            <option value="open_desc">OPEN DATE (NEWEST)</option>
                                            <option value="due_asc">DUE DATE (NEAREST)</option>
                                        </select>
                                    </div>

                                    {/* Quick Line Filters */}
                                    <div className="flex gap-2 overflow-x-auto pb-2 custom-scroll">
                                        <button onClick={() => setLineFilter('All')} className={'px-3 py-1.5 rounded-lg text-[10px] font-black uppercase italic tracking-wider transition ' + (lineFilter === 'All' ? 'bg-[#00E676] text-slate-950' : 'bg-[#121824] border border-slate-850 text-slate-400') + ''}>ALL LINES</button>
                                        {lineStatsFilters.map(ls => (
                                            <button key={ls.name} onClick={() => setLineFilter(ls.name)} className={'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] font-black bg-slate-900 border transition ' + (lineFilter === ls.name ? 'border-[#00E676] text-[#00E676] bg-emerald-950/10' : 'border-slate-850 text-slate-400') + ''}>
                                                {ls.name.toUpperCase()} <span className="text-[10px] text-rose-500 font-extrabold">({ls.unclosed})</span>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-[#121824] border border-slate-850 rounded-xl overflow-hidden divide-y divide-slate-850 shadow-2xl">
                                        {filteredTasks.map(t => (
                                            <div key={t._id} className="flex flex-col">
                                                <div onClick={() => setExpandedId(expandedId === t._id ? null : t._id)} className="p-5 flex items-center justify-between cursor-pointer hover:bg-slate-900/40 transition-colors">
                                                    <div className="flex items-center gap-4 min-w-0 flex-1">
                                                        <div className="flex flex-col w-24 shrink-0 text-xs text-slate-500 italic">
                                                            <span className="font-black text-[#00E676]">{t.Source || 'SIM2'}</span>
                                                            <span>{t['Action Id']?.slice(-10)}</span>
                                                        </div>
                                                        <h4 className={'text-sm md:text-base font-black italic uppercase truncate ' + (String(t.Status).toLowerCase().includes('close') ? 'text-slate-600 line-through' : 'text-slate-100') + ''}>{t.Title || 'Untitled'}</h4>
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-[10px] font-black bg-slate-900 text-slate-300 border border-slate-800 px-3 py-1.5 rounded uppercase tracking-wider">{t.Status}</span>
                                                        <button onClick={(e) => { e.stopPropagation(); setDeleteConfirm({ id: t._id }); }} className="text-slate-600 hover:text-rose-500 transition-colors"><Icon name="Trash" size={16}/></button>
                                                    </div>
                                                </div>
                                                
                                                {}
                                                {expandedId === t._id && (
                                                    <div className="p-5 bg-slate-900/20 border-t border-slate-850 grid grid-cols-1 lg:grid-cols-2 gap-6 animate-in">
                                                        <div className="space-y-4">
                                                            <div className="p-5 bg-slate-900 border border-slate-800/80 rounded-xl italic text-xs leading-relaxed text-slate-300 font-light">
                                                                {t.Description || '--- ไม่มีรายละเอียด ---'}
                                                                <div className="mt-4 pt-4 border-t border-slate-850"><AiNextStep title={t.Title} description={t.Description} setMsg={setMsg} fetchGemini={fetchGemini} userApiKey={userApiKey} setShowApiKeyModal={setShowApiKeyModal}/></div>
                                                            </div>
                                                            
                                                            {/* ส่วนแสดงข้อมูลหลักและกล่องแก้ไข Cost / Due Date แบบ Inline */}
                                                            <div className="grid grid-cols-2 gap-2">
                                                                <DetailRow label="In Charge" val={t.In_Charge || t.Raiser} />
                                                                <DetailRow label="Line" val={t.Line || t.Area} />
                                                                
                                                                {/* ช่องแก้ไข Cost แบบใหม่ (ใช้งานได้ 100% แล้ว) */}
                                                                {editingCostId === t._id ? (
                                                                    <div className="bg-slate-900 p-3 md:p-4 rounded-xl border border-[#00E676]/50 shadow-sm flex flex-col gap-1">
                                                                        <span className="text-[10px] md:text-xs font-black text-[#00E676] uppercase italic leading-none tracking-widest">Cost (THB)</span>
                                                                        <input 
                                                                            type="text" 
                                                                            className="bg-slate-950 text-xs md:text-sm text-white font-bold border border-slate-800 rounded px-2 py-1 focus:border-[#00E676] outline-none"
                                                                            value={tempCost}
                                                                            onChange={e => setTempCost(e.target.value)}
                                                                            onBlur={() => saveCostEdit(t._id)}
                                                                            onKeyDown={e => { if(e.key === 'Enter') saveCostEdit(t._id); }}
                                                                            autoFocus
                                                                        />
                                                                    </div>
                                                                ) : (
                                                                    <div 
                                                                        className="bg-slate-900 p-3 md:p-4 rounded-xl border border-slate-800/80 shadow-sm flex flex-col gap-1 overflow-hidden cursor-pointer hover:border-[#00E676]/40 transition-all group"
                                                                        onClick={() => { setEditingCostId(t._id); setTempCost(t.Cost || ''); }}
                                                                    >
                                                                        <span className="text-[10px] md:text-xs font-black text-slate-500 uppercase italic leading-none tracking-widest flex justify-between items-center">
                                                                            <span>Cost (THB)</span>
                                                                            <span className="text-[8px] text-amber-500 opacity-0 group-hover:opacity-100 transition-opacity font-bold">✏️ EDIT</span>
                                                                        </span>
                                                                        <span className="text-xs md:text-sm font-bold text-slate-200 italic leading-tight pr-1 break-words">{t.Cost || '---'}</span>
                                                                    </div>
                                                                )}

                                                                {/* ช่องแก้ไข Due Date แบบใหม่ (ใช้งานได้ 100% แล้ว) */}
                                                                {editingDueDateId === t._id ? (
                                                                    <div className="bg-slate-900 p-3 md:p-4 rounded-xl border border-[#00E676]/50 shadow-sm flex flex-col gap-1">
                                                                        <span className="text-[10px] md:text-xs font-black text-[#00E676] uppercase italic leading-none tracking-widest">Due Date</span>
                                                                        <input 
                                                                            type="date" 
                                                                            className="bg-slate-950 text-xs text-white font-bold border border-slate-800 rounded px-2 py-1 focus:border-[#00E676] outline-none"
                                                                            value={tempDueDate ? tempDueDate.split('T')[0] : ''}
                                                                            onChange={e => setTempDueDate(e.target.value)}
                                                                            onBlur={() => saveDueDateEdit(t)}
                                                                            onKeyDown={e => { if(e.key === 'Enter') saveDueDateEdit(t); }}
                                                                            autoFocus
                                                                        />
                                                                    </div>
                                                                ) : (
                                                                    <div 
                                                                        className="bg-slate-900 p-3 md:p-4 rounded-xl border border-slate-800/80 shadow-sm flex flex-col gap-1 overflow-hidden cursor-pointer hover:border-[#00E676]/40 transition-all group"
                                                                        onClick={() => { setEditingDueDateId(t._id); setTempDueDate(t['Due Date'] || ''); }}
                                                                    >
                                                                        <span className="text-[10px] md:text-xs font-black text-slate-500 uppercase italic leading-none tracking-widest flex justify-between items-center">
                                                                            <span>Due Date</span>
                                                                            <span className="text-[8px] text-amber-500 opacity-0 group-hover:opacity-100 transition-opacity font-bold">✏️ EDIT</span>
                                                                        </span>
                                                                        <span className="text-xs md:text-sm font-bold text-slate-200 italic leading-tight pr-1 break-words">{formatDate(t['Due Date'])}</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>

                                                        <div className="space-y-4">
                                                            <textarea className="w-full p-4 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 h-24 italic" placeholder="Follow-up Notes..." value={t.Note || ''} onChange={async (e) => await setDoc(doc(db, ...publicPath, 'actions', t._id), { Note: e.target.value }, { merge: true })} />
                                                            
                                                            {/* 🔗 กล่องจัดการลิงก์แนบและปุ่มแสดงตัวอย่าง (ไม่หายแน่นอน มีระบบเช็กสถิติที่แข็งแกร่ง) */}
                                                            <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-800 flex flex-col gap-3">
                                                                <span className="text-[10px] font-black text-blue-400 uppercase tracking-widest italic flex items-center justify-between">
                                                                    <span>🔗 Attachment Link (URL เอกสารแนบ)</span>
                                                                    {editingAttachmentId === t._id && <span className="text-[#00E676] animate-pulse">EDITING</span>}
                                                                </span>
                                                                <input 
                                                                    className="w-full text-xs text-slate-200 bg-slate-950 border border-slate-800 rounded-lg p-2.5 outline-none focus:border-[#00E676] transition-all font-mono" 
                                                                    placeholder="กรอก URL เอกสารแนบ เช่น https://..." 
                                                                    value={editingAttachmentId === t._id ? tempAttachment : (t.Attachment || '')} 
                                                                    onFocus={() => { setEditingAttachmentId(t._id); setTempAttachment(t.Attachment || ''); }}
                                                                    onChange={(e) => setTempAttachment(e.target.value)}
                                                                    onBlur={async () => {
                                                                        await setDoc(doc(db, ...publicPath, 'actions', t._id), { Attachment: tempAttachment }, { merge: true });
                                                                        setEditingAttachmentId(null);
                                                                        setMsg("Link Saved!");
                                                                    }}
                                                                    onKeyDown={async (e) => {
                                                                        if(e.key === 'Enter'){
                                                                            await setDoc(doc(db, ...publicPath, 'actions', t._id), { Attachment: tempAttachment }, { merge: true });
                                                                            setEditingAttachmentId(null);
                                                                            setMsg("Link Saved!");
                                                                        }
                                                                    }}
                                                                />
                                                                
                                                                {/* ปุ่มพรีวิว: แสดงอยู่ตลอดเวลา ถ้ามีข้อมูลปุ่มจะเขียวสว่างวาบ ถ้าไม่มีจะเป็นสีทึบเพื่อเตือนความจำ */}
                                                                {(t.Attachment || tempAttachment || t.Image) ? (
                                                                    <button 
                                                                        type="button"
                                                                        onClick={(e) => { 
                                                                            e.stopPropagation(); 
                                                                            const activeUrl = tempAttachment || t.Attachment || t.Image;
                                                                            if(activeUrl) setPreviewUrl(activeUrl); 
                                                                        }}
                                                                        className="w-full py-2.5 bg-[#00E676] hover:bg-[#00c853] text-slate-950 font-black rounded-lg text-[10px] uppercase transition-all flex items-center justify-center gap-1.5 tracking-widest active:scale-95 shadow-lg shadow-[#00E676]/20"
                                                                    >
                                                                        <Icon name="Search" size={12} className="stroke-[3]" /> กดเพื่อแสดงตัวอย่าง
                                                                    </button>
                                                                ) : (
                                                                    <button 
                                                                        disabled
                                                                        className="w-full py-2.5 bg-slate-800 text-slate-500 rounded-lg text-[10px] font-black uppercase flex items-center justify-center gap-1.5 tracking-widest cursor-not-allowed opacity-50"
                                                                    >
                                                                        <Icon name="Search" size={12} /> ยังไม่มีลิงก์เอกสารให้พรีวิว
                                                                    </button>
                                                                )}
                                                            </div>

                                                            {t.Image && <img src={t.Image} className="w-full h-32 object-contain bg-slate-900 border border-slate-800 rounded-xl p-2 cursor-pointer" onClick={() => setPreviewUrl(t.Image)} />}
                                                            
                                                            <div className="flex gap-2">
                                                                <label className="flex-1 cursor-pointer py-2 bg-slate-900 border border-dashed border-slate-800 text-slate-400 hover:text-[#00E676] rounded-lg text-[10px] font-black text-center tracking-wider uppercase transition">
                                                                    📷 ATTACH IMAGE <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(e, t._id)} />
                                                                </label>
                                                                {t.Attachment && <button onClick={() => setPreviewUrl(t.Attachment)} className="px-4 bg-slate-900 text-blue-400 text-[10px] font-black border border-slate-800 rounded-lg uppercase tracking-wider">PREVIEW LINK</button>}
                                                            </div>

                                                            <button onClick={async () => {
                                                                const s = String(t.Status).toLowerCase();
                                                                const next = s.includes('open') ? 'In Progress' : s.includes('progress') ? 'Closed' : 'Open';
                                                                await setDoc(doc(db, ...publicPath, 'actions', t._id), { Status: next }, { merge: true });
                                                            }} className="w-full py-3.5 bg-slate-900 hover:bg-[#00E676] hover:text-slate-950 border border-slate-800 text-white rounded-lg text-xs font-black uppercase tracking-widest transition-all">CYCLE STATUS</button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Modals & Lightbox */}
                    {previewUrl && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-[400] flex items-center justify-center p-4" onClick={() => setPreviewUrl(null)}>
                            <img src={previewUrl} className="max-w-full max-h-[85vh] object-contain bg-[#121824] p-3 rounded-xl border border-slate-800" onError={(e) => { window.open(previewUrl, '_blank'); setPreviewUrl(null); }} />
                        </div>
                    )}

                    {deleteConfirm && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm">
                            <div className="bg-[#121824] p-8 rounded-xl max-w-sm w-full text-center border border-slate-800 shadow-2xl">
                                <h4 className="font-black text-white uppercase italic tracking-wider mb-2">Confirm Delete?</h4>
                                <p className="text-slate-500 text-xs mb-6">This operation cannot be undone.</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-slate-900 text-slate-400 rounded-lg text-xs font-black uppercase tracking-wider">Abort</button>
                                    <button onClick={confirmDelete} className="flex-1 py-3 bg-rose-600 text-white rounded-lg text-xs font-black uppercase tracking-wider">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showApiKeyModal && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/80 backdrop-blur-sm">
                            <div className="bg-[#121824] p-8 rounded-xl max-w-md w-full border border-slate-800 shadow-2xl">
                                <h3 className="font-black text-white uppercase italic tracking-wider mb-2">Gemini API Setup</h3>
                                <p className="text-slate-500 text-xs mb-4">API configuration keys are stored only on your local browser.</p>
                                <input type="password" placeholder="AIzaSy..." className="w-full p-4 bg-slate-900 border border-slate-800 rounded-lg mb-6 text-xs font-mono text-slate-200 outline-none focus:border-[#00E676]" value={tempApiKey} onChange={e => setTempApiKey(e.target.value)} />
                                <div className="flex gap-2">
                                    <button onClick={() => setShowApiKeyModal(false)} className="py-3 px-4 bg-slate-900 text-slate-400 rounded-lg text-xs font-black uppercase tracking-wider">Cancel</button>
                                    <button onClick={clearApiKey} className="py-3 px-4 bg-rose-950/20 text-rose-500 rounded-lg text-xs font-black uppercase tracking-wider mr-auto">Clear</button>
                                    <button onClick={saveApiKey} className="py-3 px-5 bg-[#00E676] text-slate-950 rounded-lg text-xs font-black uppercase tracking-widest">Save</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
    </script>

    <script>
        (function() {
            function startAppCompilation() {
                try {
                    const rawText = document.getElementById('react-code-holder').textContent;
                    const compiled = Babel.transform(rawText, {
                        presets: ['react'],
                        plugins: [
                            ['transform-react-jsx', { runtime: 'classic' }]
                        ]
                    }).code;
                    
                    const finalScript = document.createElement('script');
                    finalScript.text = compiled;
                    document.body.appendChild(finalScript);
                    
                    waitForFirebase((fb) => {
                        const root = ReactDOM.createRoot(document.getElementById('root'));
                        root.render(React.createElement(App, { fb: fb }));
                    });
                } catch(err) {
                    console.error("Compilation failed:", err.message);
                    setTimeout(startAppCompilation, 100);
                }
            }
            setTimeout(startAppCompilation, 50);
        })();
    </script>
</body>
</html>
