    <script>
        window.SIM2_FB = null;
        
        function initFirebaseBridge() {
            if (typeof firebase !== 'undefined') {
                window.SIM2_FB = { 
                    initializeApp: (config) => firebase.initializeApp(config), 
                    getAuth: (app) => firebase.auth(app), 
                    signInAnonymously: (auth) => auth.signInAnonymously(), 
                    signInWithCustomToken: (auth, token) => auth.signInWithCustomToken(token), 
                    onAuthStateChanged: (auth, callback) => auth.onAuthStateChanged(callback), 
                    getFirestore: (app) => firebase.firestore(app), 
                    initializeFirestore: (app, settings) => {
                        const db = firebase.firestore(app);
                        try { if (settings) db.settings(settings); } catch (e) {}
                        return db;
                    }, 
                    collection: (db, ...paths) => db.collection(paths.join('/')), 
                    doc: (db, ...paths) => db.doc(paths.join('/')), 
                    setDoc: (docRef, data, options) => docRef.set(data, options || {}), 
                    deleteDoc: (docRef) => docRef.delete(), 
                    onSnapshot: (ref, next, error) => {
                        return ref.onSnapshot((snap) => {
                            if (snap) {
                                try {
                                    const existsVal = !!snap.exists;
                                    Object.defineProperty(snap, 'exists', {
                                        value: () => existsVal,
                                        configurable: true,
                                        enumerable: true,
                                        writable: true
                                    });
                                } catch (e) {}

                                if (snap.docs && Array.isArray(snap.docs)) {
                                    snap.docs.forEach(docSnap => {
                                        try {
                                            const docExists = !!docSnap.exists;
                                            Object.defineProperty(docSnap, 'exists', {
                                                value: () => docExists,
                                                configurable: true,
                                                enumerable: true,
                                                writable: true
                                            });
                                        } catch (e) {}
                                    });
                                }
                            }
                            next(snap);
                        }, error);
                    }, 
                    writeBatch: (db) => {
                        const batch = db.batch();
                        return {
                            set: (docRef, data, options) => batch.set(docRef, data, options || {}),
                            update: (docRef, data) => batch.update(docRef, data),
                            delete: (docRef) => batch.delete(docRef),
                            commit: () => batch.commit()
                        };
                    } 
                };
            } else {
                setTimeout(initFirebaseBridge, 50);
            }
        }
        initFirebaseBridge();
    </script>

        const fetchGemini = async (prompt, userKey, systemPrompt = "You are a professional industrial project manager and engineering advisor.") => {
            if (!userKey) throw new Error("NO_API_KEY");
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            while (retries < 5) {
                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + userKey, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error?.message || "API Error");
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (error) {
                    if (error.message === "NO_API_KEY") throw error;
                    if (retries === 4) throw error;
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }

                sessionStorage.removeItem('rs_task_session');
                setAllData([]);
                setMsg('Signed out of operational center');
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Firebase auth bridge initialization failed:", e);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setFbUser);
                return () => unsubscribe();
            }, [auth]);

            const availableYearsList = useMemo(() => {
                const years = new Set([currentYearValue, currentYearValue + 1, currentYearValue - 1]);
                allData.forEach(t => {
                    const dateVal = t['Opening Date'] || t.OpenedAt || t['Due Date'];
                    if (dateVal) {
                        const d = new Date(dateVal);
                        if (!isNaN(d.getTime())) {
                            years.add(d.getFullYear());
                        }
                    }
                });
                return Array.from(years).sort((a, b) => b - a);
            }, [allData, currentYearValue]);

            const generateNextId = () => {
                let maxNum = 0;
                allData.forEach(t => {
                    const id = String(t['Action Id'] || '').trim().toUpperCase();
                    if (id.startsWith('2026-')) {
                        const numPart = parseInt(id.replace('2026-', ''), 10);
                        if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
                    }
                });
                return '2026-' + String(maxNum + 1).padStart(3, '0');
            };

            useEffect(() => {
                if (view === 'add' && newItem['Action Id'] === '') {
                    setNewItem(prev => ({ ...prev, 'Action Id': generateNextId() }));
                }
            }, [view, allData]);

            useEffect(() => {
                if (!session || !fbUser) return;
                const actionsCol = collection(db, ...publicPath, 'actions');
                const unsubData = onSnapshot(actionsCol, 
                    (snap) => setAllData(snap.docs.map(doc => ({ ...doc.data(), _id: doc.id }))),
                    (err) => console.error("Snapshot error on actionsCol:", err)
                );
                const metaDoc = doc(db, ...publicPath, 'metadata', 'sync_info');
                const unsubMeta = onSnapshot(metaDoc, 
                    (docSnap) => { if (docSnap.exists()) setMeta(docSnap.data()); },
                    (err) => console.error("Snapshot error on metaDoc:", err)
                );
                return () => { unsubData(); unsubMeta(); };
            }, [session, fbUser, db]);

            useEffect(() => setIsSidebarOpen(false), [view]);

            const myTasksRaw = useMemo(() => {
                return allData.filter(t => {
                    const nameFields = String(t.In_Charge || t.Owner || t.Raiser || t.Responsible || t.OwnerName || t.Rattanachot || '').toLowerCase();
                    return nameFields.includes('rattanachot') || nameFields.includes('siriwanit') || nameFields.includes('รัตนโชติ');
                });
            }, [allData]);

            const myAllTasks = useMemo(() => {
                return myTasksRaw.filter(t => {
                    const statusStr = String(t.Status || '').toLowerCase();
                    const isClosed = statusStr.includes('close') || statusStr.includes('succ');
                    const dateStr = isClosed 
                        ? (t.ClosedAt || t.ClosedDate || t['Opening Date'] || t.OpenedAt)
                        : (t['Opening Date'] || t.OpenedAt || t['Due Date']);
                    const d = new Date(dateStr);
                    return !isNaN(d.getTime()) && d.getFullYear() === selectedYear;
                });
            }, [myTasksRaw, selectedYear]);

            const lineOptions = useMemo(() => {
                const counts = {};
                myAllTasks.forEach(t => {
                    const line = t.Line || t.Area || 'Unknown';
                    if (String(t.Status || '').toLowerCase().includes('open')) counts[line] = (counts[line] || 0) + 1;
                });
                return Object.entries(counts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
            }, [myAllTasks]);

            const filteredTasks = useMemo(() => {
                let tasks = [...myAllTasks];
                if (search) {
                    tasks = tasks.filter(t => Object.values(t).some(v => String(v).toLowerCase().includes(search.toLowerCase())));
                }
                if (statusFilter !== 'All') {
                    const sf = statusFilter.toLowerCase();
                    tasks = tasks.filter(t => {
                         const s = String(t.Status || '').toLowerCase();
                         if (sf === 'in progress') return s.includes('progress');
                         return s.includes(sf);
                    });
                }
                if (lineFilter !== 'All') tasks = tasks.filter(t => (t.Line || t.Area || 'Unknown') === lineFilter);
                return tasks.sort((a, b) => {
                    if (sortBy === 'open_desc') return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);
                    if (sortBy === 'open_asc') return new Date(a['Opening Date'] || a.OpenedAt || 0) - new Date(b['Opening Date'] || b.OpenedAt || 0);
                    const getDue = (t) => { const d = t['Due Date'] || t['Due Date R/S*'] || t.DueDate; return d ? new Date(d).getTime() : null; };
                    if (sortBy === 'due_asc') return (getDue(a) || Infinity) - (getDue(b) || Infinity);
                    if (sortBy === 'due_desc') return (getDue(b) || -Infinity) - (getDue(a) || -Infinity);
                    if (String(a.Status).toLowerCase().includes('closed') && !String(b.Status).toLowerCase().includes('closed')) return 1;
                    if (!String(a.Status).toLowerCase().includes('closed') && String(b.Status).toLowerCase().includes('closed')) return -1;
                    return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);
                });
            }, [myAllTasks, search, statusFilter, lineFilter, sortBy]);

            const dashboardData = useMemo(() => {
                const months = Array(12).fill(0);
                const openCounts = Array(12).fill(0);
                const closedCounts = Array(12).fill(0);
                let totalSpent = 0;
                let totalClosed = 0;
                let pendingCount = 0;
                let progressCount = 0;
                let successCount = 0;
                let totalCount = 0;

                myTasksRaw.forEach(t => {
                    const statusStr = String(t.Status || '').toLowerCase();
                    const isClosed = statusStr.includes('close') || statusStr.includes('succ');
                    
                    const dateStr = isClosed 
                        ? (t.ClosedAt || t.ClosedDate || t['Opening Date'] || t.OpenedAt)
                        : (t['Opening Date'] || t.OpenedAt || t['Due Date']);
                    
                    const d = new Date(dateStr);
                    if (!isNaN(d.getTime()) && d.getFullYear() === selectedYear) {
                        totalCount++;
                        const month = d.getMonth();
                        
                        if (isClosed) {
                            successCount++;
                            closedCounts[month] += 1;
                            totalClosed += 1;
                            
                            const cost = parseFloat(String(t.Cost || t.Budget || '0').replace(/,/g, "")) || 0;
                            if (cost > 0) {
                                months[month] += cost;
                                totalSpent += cost;
                            }
                        } else {
                            if (statusStr.includes('progress')) {
                                progressCount++;
                            } else {
                                pendingCount++;
                            }
                            openCounts[month] += 1;
                        }
                    }
                });

                const maxCostVal = Math.max(...months, 1);
                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                
                const chart = months.map((val, idx) => ({
                    label: monthNames[idx],
                    val,
                    openCount: openCounts[idx],
                    closedCount: closedCounts[idx],
                    height: val > 0 ? Math.max((val / maxCostVal) * 100, 4) : 0
                }));

                return {
                    chart,
                    totalSpent,
                    totalClosed,
                    stats: {
                        total: totalCount,
                        open: pendingCount,
                        progress: progressCount,
                        closed: successCount
                    }
                };
            }, [myTasksRaw, selectedYear]);

            const saveApiKey = () => { localStorage.setItem('gemini_api_key', tempApiKey); setUserApiKey(tempApiKey); setShowApiKeyModal(false); setMsg("Gemini API Key successfully updated!"); };
            const clearApiKey = () => { localStorage.removeItem('gemini_api_key'); setUserApiKey(''); setTempApiKey(''); };

            const updateStatus = async (id, newStatus) => {
                if (isReadOnly || !fbUser) return;
                try {
                    await setDoc(doc(db, ...publicPath, 'actions', id), { Status: newStatus }, { merge: true });
                    setMsg(`Job status successfully changed to: ${newStatus}`);
                } catch (e) {
                    setMsg("Operational Error: Failed to update status");
                }
            };

            const handleGenerateSummary = async () => {
                if (myAllTasks.length === 0) return;
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setIsAiLoading(true);
                try {
                    let dataForAi = "";
                    const openTasks = myAllTasks.filter(t => String(t.Status || '').toLowerCase().includes('open') || String(t.Status || '').toLowerCase().includes('progress'));
                    const lineAnalysis = {};
                    openTasks.forEach(t => {
                        const line = t.Line || t.Area || 'Unknown';
                        if (!lineAnalysis[line]) lineAnalysis[line] = { count: 0, actions: [] };
                        lineAnalysis[line].count += 1;
                        lineAnalysis[line].actions.push('- [ ' + t.Status + ' ] ' + t.Title);
                    });
                    Object.entries(lineAnalysis).sort((a,b)=>b[1].count-a[1].count).slice(0,5).forEach(([line, data]) => {
                        dataForAi += 'Line: ' + line + ' (' + data.count + ' items):\n' + data.actions.join('\n') + '\n\n';
                    });
                    const summary = await fetchGemini('Analyze the current workspace backlog list:\n\n' + dataForAi + '\nSuggest 3 quick, plain English actions for our plant engineer to solve these issues immediately.', userApiKey);
                    setAiSummary(summary);
                } catch (error) { setMsg("AI Report Compilation Failed"); }
                setIsAiLoading(false);
            };

            const handleSuggestDescription = async () => {
                if (!newItem.Title) { setMsg("Please fill in the Job Title first."); return; }
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setIsAiLoading(true);
                try {
                    const suggested = await fetchGemini('Draft a short, neat operational description (under 100 words in simple English) for: "' + newItem.Title + '"', userApiKey);
                    setNewItem(prev => ({ ...prev, Description: suggested }));
                } catch (error) { setMsg("AI Suggestion Failed"); }
                setIsAiLoading(false);
            };

            const handleUpload = (e) => {
                if (isReadOnly || !fbUser) return;
                const file = e.target.files[0]; if (!file) return;
                setSyncProgress("Reading and parsing spreadsheet database...");
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const cleanText = ev.target.result.replace(/^\uFEFF/, '').trim();
                        const delimiter = cleanText.indexOf(';') !== -1 ? ';' : ',';
                        const rows = []; let row = []; let cur = ''; let inQuote = false;
                        for (let i = 0; i < cleanText.length; i++) {
                            const char = cleanText[i];
                            if (char === '"') inQuote = !inQuote;
                            else if (char === delimiter && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                            else if (char === '\n' && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); row = []; cur = ''; }
                            else if (char !== '\r') cur += char;
                        }
                        if (cur || row.length > 0) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); }
                        const hIdx = rows.findIndex(r => r.some(c => String(c).toLowerCase().includes('id')));
                        const headers = rows[hIdx].map(h => h.trim());
                        let idIdx = headers.findIndex(h => h.toLowerCase() === 'action id');
                        if (idIdx === -1) idIdx = headers.findIndex(h => h.toLowerCase().includes('id'));
                        
                        const dataRows = rows.slice(hIdx + 1).filter(r => r[idIdx]);
                        let successCount = 0; const batch = writeBatch(db);
                        dataRows.forEach(r => {
                            const cleanId = String(r[idIdx]).toUpperCase().replace(/[^a-zA-Z0-9-]/g, '-').trim();
                            if (cleanId.length > 1) {
                                const obj = { Source: 'SIM2' };
                                headers.forEach((h, idx) => { if (h && r[idx] !== undefined) obj[h.replace(/[./*\[\]#$]/g, '_')] = r[idx]; });
                                batch.set(doc(db, ...publicPath, 'actions', cleanId), obj, { merge: true });
                                successCount++;
                            }
                        });
                        await batch.commit();
                        await setDoc(doc(db, ...publicPath, 'metadata', 'sync_info'), { lastUpload: new Date().toISOString() }, { merge: true });
                        setMsg('Successfully uploaded and synchronized ' + successCount + ' records!');
                    } catch (err) { setMsg("Upload error: check CSV format"); }
                    setSyncProgress(null);
                };
                reader.readAsText(file);
            };

            const handleAddItem = async (e) => {
                e.preventDefault();
                if (isReadOnly) return;
                
                if (!fbUser) { setMsg("Database offline. Reconnecting..."); return; }
                if (!newItem['Action Id'] || !newItem.Title || !newItem.Line) { setMsg("Validation error: Job ID, Title, and Production Line are required."); return; }

                const cleanId = newItem['Action Id'].toUpperCase().replace(/[^a-zA-Z0-9-]/g, '-').trim();
                if (!cleanId) { setMsg("Invalid Action ID form."); return; }

                setSyncProgress("Posting new operation log to Cloud database...");
                try {
                    const defaultDueDate = new Date(); 
                    defaultDueDate.setDate(defaultDueDate.getDate() + 7);
                    const finalDueDate = newItem['Due Date'] ? new Date(newItem['Due Date']).toISOString() : defaultDueDate.toISOString();
                    
                    await setDoc(doc(db, ...publicPath, 'actions', cleanId), { 
                        ...newItem, 
                        'Due Date': finalDueDate, 
                        Source: 'Manual Entry', 
                        'Action Id': cleanId, 
                        editCount: 0 
                    }, { merge: true });
                    
                    setMsg("New Action successfully registered!");
                    setNewItem({ 
                        'Action Id': '', 
                        'Title': '', 
                        'Description': '', 
                        'Cost': '', 
                        'Opening Date': new Date().toISOString(), 
                        'Due Date': '', 
                        'Status': 'Open', 
                        'In_Charge': 'Rattanachot Siriwanit', 
                        'Line': '', 
                        'Attachment': '' 
                    });
                    setView('list');
                } catch (e) { 
                    console.error("Failed to set doc:", e);
                    setMsg("Failed to upload: " + e.message); 
                }
                setSyncProgress(null);
            };

            const confirmDelete = async () => { if (isReadOnly || !fbUser) return; await deleteDoc(doc(db, ...publicPath, 'actions', deleteConfirm.id)); setMsg("Action successfully deleted"); setDeleteConfirm(null); };
            const saveCostEdit = async (id) => { if (isReadOnly || !fbUser) return; await setDoc(doc(db, ...publicPath, 'actions', id), { Cost: tempCost }, { merge: true }); setEditingCostId(null); setMsg("Action cost successfully updated"); };
            const saveDescEdit = async (t) => { if (isReadOnly || !fbUser) return; await setDoc(doc(db, ...publicPath, 'actions', t._id), { Description: tempDesc, editCount: (t.editCount || 0) + 1 }, { merge: true }); setEditingDescId(null); setMsg("Description successfully updated"); };
            const saveDueDateEdit = async (t) => { if (isReadOnly || !fbUser) return; await setDoc(doc(db, ...publicPath, 'actions', t._id), { 'Due Date': tempDueDate ? new Date(tempDueDate).toISOString() : '', dueDateEditCount: (t.dueDateEditCount || 0) + 1 }, { merge: true }); setEditingDueDateId(null); setMsg("Job deadline successfully extended"); };
            const saveAttachmentEdit = async (t) => { if (isReadOnly || !fbUser) return; await setDoc(doc(db, ...publicPath, 'actions', t._id), { Attachment: tempAttachment }, { merge: true }); setEditingAttachmentId(null); setMsg("Reference document link updated"); };

            const handleImageUpload = (e, id) => {
                if (isReadOnly || !fbUser) return;
                const file = e.target.files[0]; if (!file) return;
                setSyncProgress("Attaching and scaling proof photo...");
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 800; let scaleSize = 1;
                        if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                        canvas.width = img.width * scaleSize; canvas.height = img.height * scaleSize;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        try {
                            await setDoc(doc(db, ...publicPath, 'actions', id), { Image: canvas.toDataURL('image/jpeg', 0.7) }, { merge: true });
                            setMsg("Job image attached successfully!");
                        } catch(err) { setMsg("Failed to upload image resource"); }
                        setSyncProgress(null);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="flex h-screen bg-[#080b11] relative overflow-hidden font-['Prompt'] text-slate-100 select-none">
                    {/* Mobile Sidebar Overlay */}
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[25] md:hidden" onClick={() => setIsSidebarOpen(false)} />}

                    <aside className={`fixed md:relative inset-y-0 left-0 w-64 bg-[#0c0f16] flex flex-col shrink-0 z-30 border-r border-slate-900 transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-8 flex flex-col items-center text-center relative border-b border-slate-900">
                            <button onClick={() => setIsSidebarOpen(false)} className="absolute top-4 right-4 text-slate-500 md:hidden hover:text-white"><Icon name="X" size={24} /></button>
                            <div className="w-12 h-12 bg-gradient-to-tr from-[#00E676] to-[#00b0ff] rounded-xl flex items-center justify-center font-black italic shadow-lg mb-3 shadow-[#00E676]/10">
                                <span className="text-slate-950 text-xl font-bold tracking-tighter">RS</span>
                            </div>
                            <h1 className="font-black italic uppercase tracking-widest text-white text-md leading-none">Rattanachot Task</h1>
                            <span className={'text-[9px] font-black uppercase tracking-wider mt-2 px-2.5 py-1 rounded-md border border-slate-800 ' + (isReadOnly ? 'text-blue-400 bg-blue-950/20 border-blue-900/30' : 'text-[#00E676] bg-emerald-950/20 border-emerald-900/30')}>
                                {isReadOnly ? 'READ-ONLY GUEST' : 'SECURE ADMIN'}
                            </span>
                        </div>
                        
                        <nav className="flex-1 py-6 px-2 space-y-1">
                            <SidebarBtn icon={<Icon name="Dashboard" />} label="DASHBOARD OVERVIEW" active={view === 'dashboard'} onClick={() => setView('dashboard')} />
                            <SidebarBtn icon={<Icon name="List" />} label="MASTER ACTION LIST" active={view === 'list'} onClick={() => setView('list')} />
                            {!isReadOnly && <SidebarBtn icon={<Icon name="Plus" />} label="ADD MANUAL JOB" active={view === 'add'} onClick={() => setView('add')} />}
                        </nav>

                        {/* Fiscal Year Controller */}
                        <div className="p-4 border-t border-slate-900/60 bg-[#090c13] flex flex-col gap-1.5">
                            <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest italic flex items-center gap-1">
                                <Icon name="Calendar" size={12} className="text-[#00E676]" /> FISCAL YEAR (FY)
                            </span>
                            <div className="relative">
                                <select 
                                    className="w-full appearance-none pl-4 pr-10 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs font-black uppercase italic text-[#00E676] focus:border-[#00E676] outline-none transition cursor-pointer tracking-wider"
                                    value={selectedYear}
                                    onChange={(e) => {
                                        setSelectedYear(Number(e.target.value));
                                        setMsg(`Switched to operational list: FY ${e.target.value}`);
                                    }}
                                >
                                    {availableYearsList.map(yr => (
                                        <option key={yr} value={yr}>FY {yr}</option>
                                    ))}
                                </select>
                            </div>
                        </div>
                        
                        <div className="p-4 border-t border-slate-900 flex flex-col gap-2 bg-[#0a0d14]">
                            {!isReadOnly && (
                                <Fragment>
                                    <label className="flex items-center justify-center gap-2 w-full py-3 bg-[#00E676] text-slate-950 rounded-lg font-black text-xs uppercase cursor-pointer hover:bg-[#00c853] transition shadow-md shadow-[#00E676]/10 active:scale-95 tracking-widest">
                                        <Icon name="Plus" size={16} /> IMPORT CSV LOG
                                        <input type="file" className="hidden" accept=".csv" onChange={handleUpload}/>
                                    </label>
                                    <button onClick={() => { setTempApiKey(userApiKey); setShowApiKeyModal(true); }} className="flex items-center justify-center gap-2 w-full py-2 border border-slate-800 text-slate-500 rounded-lg font-black text-xs uppercase hover:bg-slate-900 hover:text-white transition active:scale-95 tracking-widest">
                                        <Icon name="Settings" size={14} /> AI COGNITIVE SETTINGS
                                    </button>
                                </Fragment>
                            )}
                            <button onClick={handleSignOut} className="flex items-center justify-center gap-2 w-full py-2 border border-rose-900/40 text-rose-500 bg-rose-950/5 rounded-lg font-black text-xs uppercase hover:bg-rose-950/20 hover:text-rose-400 transition active:scale-95 tracking-widest">
                                <Icon name="LogOut" size={14} /> EXIT OPERATIONS
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-[#080b11]">
                        <header className="h-16 bg-[#0c0f16] border-b border-slate-900 px-6 md:px-10 flex items-center justify-between z-10 shrink-0">
                            <div className="flex items-center gap-3 md:gap-4">
                                <button onClick={() => setIsSidebarOpen(true)} className="p-2 text-slate-400 hover:text-[#00E676] md:hidden"><Icon name="Menu" size={24} /></button>
                                <Icon name="Target" size={20} className="text-[#00E676] animate-pulse" />
                                <span className="text-xs md:text-sm font-black text-slate-200 uppercase tracking-widest italic pt-1 pr-1">RS COMMAND CENTER</span>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <select className="appearance-none pl-4 pr-10 py-2.5 bg-slate-900 border border-slate-850 rounded-lg text-xs font-black uppercase italic text-slate-300 focus:border-[#00E676] outline-none transition cursor-pointer tracking-wider" value={lineFilter} onChange={(e) => setLineFilter(e.target.value)}>
                                    <option value="All">ALL LINES</option>
                                    {lineOptions.map(opt => <option key={opt.name} value={opt.name}>{opt.name.toUpperCase()} ({opt.count})</option>)}
                                </select>
                                <input type="text" placeholder="Quick Search..." className="pl-4 pr-4 py-2.5 bg-slate-900 border border-slate-850 rounded-lg text-xs md:text-sm text-white focus:border-[#00E676] outline-none transition placeholder-slate-600" value={search} onChange={(e) => setSearch(e.target.value)} />
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-10 custom-scroll relative bg-[#080b11]">
                            {/* System Toast Alerts */}
                            {msg && <div className="fixed top-20 right-4 z-[100] px-5 py-3 bg-slate-900 text-[#00E676] rounded-xl shadow-2xl font-black text-xs uppercase border border-[#00E676]/30 tracking-widest animate-pulse">{msg}</div>}
                            {syncProgress && <div className="fixed inset-0 z-[100] bg-[#080b11]/90 backdrop-blur-md flex flex-col items-center justify-center text-[#00E676] font-black uppercase italic animate-pulse tracking-widest">{syncProgress}</div>}

                            {view === 'dashboard' ? (
                                <div className="max-w-6xl mx-auto space-y-6 animate-in">
                                    <div className="flex justify-between items-end border-b border-slate-900 pb-5">
                                        <div>
                                            <h3 className="text-xl md:text-2xl font-black text-white uppercase italic tracking-wider">WORKSPACE ANALYTICS</h3>
                                            <p className="text-[10px] md:text-xs font-black text-slate-500 uppercase tracking-widest mt-1 italic">
                                                Active Operations for Engineer Rattanachot Siriwanit - FY {selectedYear}
                                            </p>
                                        </div>
                                        <button onClick={handleGenerateSummary} disabled={isAiLoading} className="bg-slate-900 border border-slate-800 text-[#00E676] hover:bg-emerald-950/20 px-5 py-2.5 rounded-lg font-black text-xs flex items-center gap-2 uppercase tracking-widest transition shadow-sm">
                                            <Icon name="Sparkle" size={16} className={isAiLoading ? "animate-spin" : ""} /> RUN AI AUDIT
                                        </button>
                                    </div>

                                    {aiSummary && (
                                        <div className="gradient-ai p-6 rounded-xl border border-[#00E676]/20 shadow-2xl animate-in">
                                            <div className="flex items-center gap-2 mb-4 font-black text-white italic uppercase tracking-wider"><Icon name="Sparkle" className="text-[#00E676]"/> COGNITIVE AI ACTION BRIEF</div>

                                <div className="flex gap-4">
                                    <button onClick={confirmDelete} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-black uppercase text-xs rounded-lg active:scale-95 transition shadow-lg">CONFIRM DELETE</button>
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-slate-900 hover:bg-slate-850 text-slate-300 font-bold uppercase text-xs rounded-lg active:scale-95 transition border border-slate-800">CANCEL</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Gemini AI API Key Controller Modal */}
                    {showApiKeyModal && (
                        <div className="fixed inset-0 z-[500] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-[#0c0f16] border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl relative animate-in">
                                <button onClick={() => setShowApiKeyModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white"><Icon name="X" size={20} /></button>
                                <h4 className="text-sm font-black text-white uppercase italic tracking-wider mb-2 flex items-center gap-1.5"><Icon name="Settings" className="text-[#00E676]" /> GEMINI COGNITIVE API KEY</h4>
                                <p className="text-[10px] text-slate-500 mb-6 font-bold uppercase">Insert private AI model credential keys to activate automated project audits.</p>
                                <div className="space-y-4">
                                    <FormInput label="Gemini API Key" val={tempApiKey} onChange={setTempApiKey} placeholder="AIzaSy..." />
                                    <div className="flex gap-3 pt-2">
                                        <button onClick={saveApiKey} className="flex-1 py-3 bg-[#00E676] text-black font-black uppercase text-xs rounded-lg active:scale-95 transition">SAVE KEY</button>
                                        <button onClick={clearApiKey} className="py-3 px-4 bg-slate-900 hover:bg-slate-850 text-slate-500 font-bold uppercase text-xs rounded-lg active:scale-95 transition border border-slate-800">WIPE KEY</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Full Scale Immersive Image Lightbox */}
                    {previewUrl && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[400] flex items-center justify-center p-4 animate-in" onClick={() => setPreviewUrl(null)}>
                            <img src={previewUrl} className="max-w-full max-h-[85vh] object-contain bg-white p-3 rounded-xl border border-slate-300 shadow-2xl" />
                        </div>
                    )}
                </div>
            );
        };
    </script>

    <script>
        (function() {
            function startAppCompilation() {
                try {
                    const rawText = document.getElementById('react-code-holder').textContent;
                    const compiled = Babel.transform(rawText, {
                        presets: ['react'],
                        plugins: [
                            ['transform-react-jsx', { runtime: 'classic' }]
                        ]
                    }).code;
                    
                    const finalScript = document.createElement('script');
                    finalScript.text = compiled;
                    document.body.appendChild(finalScript);
                    
                    waitForFirebase((fb) => {
                        const root = ReactDOM.createRoot(document.getElementById('root'));
                        root.render(React.createElement(App, { fb: fb }));
                    });
                } catch(err) {
                    console.error("Compilation failed:", err.message);
                    setTimeout(startAppCompilation, 100);
                }
            }
            setTimeout(startAppCompilation, 50);
        })();
    </script>
</body>
</html>
