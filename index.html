        const cleanAndFormatId = (rawId) => {
            if (!rawId) return '';
            let clean = String(rawId).replace(/[\s,'"]/g, '').trim();
            
            if (/^\d+$/.test(clean)) {
                if (clean.length === 9) {
                    return `TASK-${clean.slice(0, 3)}-${clean.slice(3, 6)}-${clean.slice(6)}`;
                }
                if (clean.length === 8) {
                    return `TASK-0${clean.slice(0, 2)}-${clean.slice(2, 5)}-${clean.slice(5)}`;
                }
                return `TASK-${clean}`;
            }
            
            if (/^\d+-\d+-\d+$/.test(clean)) {
                return `TASK-${clean}`;
            }
            
            if (clean.toUpperCase().startsWith("TASK-") || clean.toUpperCase().startsWith("ACT-")) {
                return clean.toUpperCase().replace("ACT-", "TASK-");
            }
            
            return `TASK-${clean.toUpperCase()}`;
        };

        const fetchGemini = async (prompt, userKey, systemPrompt = "คุณคือผู้ช่วยจัดการโครงการอุตสาหกรรมมืออาชีพ", modelName = "gemini-2.5-flash-preview-09-2025") => {
            if (!userKey) throw new Error("NO_API_KEY");
            const cleanKey = String(userKey).trim();
            const cleanModel = String(modelName || "gemini-2.5-flash-preview-09-2025").trim();
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            while (retries < 5) {
                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + cleanModel + ':generateContent?key=' + cleanKey, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error?.message || `API Error Status ${response.status}`);
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (error) {
                    if (error.message === "NO_API_KEY") throw error;
                    if (retries === 4) throw error;
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }
        };

            const [selectedModel, setSelectedModel] = useState(() => localStorage.getItem('gemini_model_selection') || 'gemini-2.5-flash-preview-09-2025');
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [tempApiKey, setTempApiKey] = useState('');
            const [tempModelSelection, setTempModelSelection] = useState(selectedModel);

            const [aiSummary, setAiSummary] = useState("");
            const [isAiLoading, setIsAiLoading] = useState(false);

            const [newItem, setNewItem] = useState({
                'Action Id': '', 'Title': '', 'Description': '', 'Cost': '', 'Opening Date': new Date().toISOString(), 'Due Date': '', 'Closed Date': '', 'Status': 'Open', 'In_Charge': 'Rattanachot Siriwanit', 'Line': '', 'Attachment': '' 
            });

            const isReadOnly = session === 'guest';

            // 📲 ตรวจจับพารามิเตอร์จากการสแกน QR Code เพื่อนำเข้าสิทธิ์และดึงข้อมูลอัตโนมัติบนมือถือ
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const paramSheetUrl = params.get('sheetUrl');
                const paramApiKey = params.get('apiKey');
                const paramModel = params.get('model');
                
                let updated = false;
                if (paramSheetUrl) {
                    const decodedSheet = decodeURIComponent(paramSheetUrl);
                    localStorage.setItem('rs_google_sheet_api_url', decodedSheet);
                    setSheetUrl(decodedSheet);
                    updated = true;
                }
                if (paramApiKey) {
                    const decodedKey = decodeURIComponent(paramApiKey);
                    localStorage.setItem('gemini_api_key', decodedKey);
                    setUserApiKey(decodedKey);
                    updated = true;
                }
                if (paramModel) {
                    const decodedModel = decodeURIComponent(paramModel);
                    localStorage.setItem('gemini_model_selection', decodedModel);
                    setSelectedModel(decodedModel);
                    updated = true;
                }
                if (updated) {
                    // ทำการ Bypass ล็อกอินให้ผู้ใช้ดึงข้อมูลทันทีเพื่อความสะดวกรวดเร็ว
                    setSession('admin');
                    sessionStorage.setItem('rs_task_session', 'admin');
                    
                    // เคลียร์ Query Parameter บนแถบ URL ออกเพื่อให้หน้าต่างลิงก์ดูสะอาดสวยงาม
                    window.history.replaceState({}, document.title, window.location.pathname);
                    showToast("📲 นำเข้าลิงก์ Google Sheets และคีย์ควบคุมงานสำเร็จ!");
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('rs_local_actions_db_v3', JSON.stringify(allData));
            }, [allData]);

            useEffect(() => {
                if (sheetUrl && session) {
                    pullFromGoogleSheets();
                }
            }, [sheetUrl, session]);

            const showToast = (txt) => {
                setMsg(txt);
                setTimeout(() => setMsg(null), 3000);
            };

            const isValidUrl = (string) => {
                try {
                    const url = new URL(string.trim());
                    return url.protocol === "http:" || url.protocol === "https:";
                } catch (_) {
                    return false;  
                }
            };

            const pullFromGoogleSheets = async () => {
                const trimmedUrl = String(sheetUrl || '').trim();
                if (!trimmedUrl) return;

                if (!isValidUrl(trimmedUrl)) {
                    showToast("⚠️ รูปแบบลิงก์ Google Sheets ไม่ถูกต้อง");
                    return;
                }

                setIsCloudSyncing(true);
                setShowCorsAlert(false);
                setCloudDebugInfo(null);
                try {
                    const response = await fetch(trimmedUrl);
                    if (response.ok) {
                        const cloudData = await response.json();
                        
                        if (cloudData) {
                            setCloudDebugInfo({
                                isArray: Array.isArray(cloudData),
                                length: Array.isArray(cloudData) ? cloudData.length : 0,
                                sampleRow: Array.isArray(cloudData) && cloudData.length > 0 ? cloudData[0] : cloudData,
                                raw: JSON.stringify(cloudData).slice(0, 300) + '...'
                            });
                        }

                        if (Array.isArray(cloudData) && cloudData.length > 0) {
                            const mapped = cloudData.map(row => {
                                const rawActionId = row._id || row['Action Id'] || row['ActionId'] || row['id'] || '';
                                const cleanActionId = cleanAndFormatId(rawActionId);
                                return {
                                    ...row,
                                    _id: cleanActionId,
                                    'Action Id': cleanActionId,
                                    'Title': row.Title || row['title'] || row['Objective'] || 'Untitled',
                                    'Description': row.Description || row['description'] || row['Action Detail'] || '',
                                    'Cost': String(row.Cost || row['cost'] || row['Budget'] || '0'),
                                    'Opening Date': row['Opening Date'] || row['OpeningDate'] || row['OpenedAt'] || new Date().toISOString(),
                                    'Due Date': row['Due Date'] || row['DueDate'] || row['Due Date R/S*'] || '',
                                    'Closed Date': row['Closed Date'] || row['ClosedDate'] || '',
                                    'Status': row.Status || row['status'] || 'Open',
                                    'In_Charge': row.In_Charge || row['In Charge'] || row['InCharge'] || row['Owner'] || row['Responsible'] || 'Rattanachot Siriwanit',
                                    'Line': row.Line || row['line'] || row['Area'] || '',
                                    'Attachment': row.Attachment || row['attachment'] || row['Attachment URL'] || '',
                                    'Note': row.Note || row['note'] || row['Note_Comments'] || ''
                                };
                            });
                            setAllData(mapped);
                            showToast("ซิงค์ดึงข้อมูลจาก Google Sheets บนเครื่องนี้สำเร็จ!");
                        } else {
                            showToast("ดึงข้อมูลสำเร็จ แต่โครงสร้าง JSON ไม่เป็นกลุ่มรายการ");
                        }
                    } else {
                        throw new Error(`HTTP Error Status: ${response.status}`);
                    }
                } catch(e) {
                    console.error("Failed to pull from sheets:", e);
                    if (e.name === 'TypeError' || String(e).includes('Failed to fetch')) {
                        setShowCorsAlert(true);
                        showToast("⚠️ ไม่สามารถดึงข้อมูลได้เนื่องจากสิทธิ์ CORS บน Apps Script");
                    } else {
                        showToast(`เชื่อมต่อไม่ได้: ${e.message}`);
                    }
                }
                setIsCloudSyncing(false);
            };

            const pushToGoogleSheets = async (action, dataPayload) => {
                const trimmedUrl = String(sheetUrl || '').trim();
                if (!trimmedUrl || !isValidUrl(trimmedUrl)) return;

                setIsCloudSyncing(true);
                try {
                    const cleanPayload = { ...dataPayload };
                    if (cleanPayload.Image && cleanPayload.Image.length > 20000) {
                        delete cleanPayload.Image;
                    }

                    const payloadToSend = {
                        action: action,
                        data: {
                            'Action Id': cleanAndFormatId(cleanPayload['Action Id'] || cleanPayload._id || ''),
                            'Title': cleanPayload['Title'] || '',
                            'Description': cleanPayload['Description'] || '',
                            'Cost': cleanPayload['Cost'] || '0',
                            'Opening Date': cleanPayload['Opening Date'] || '',
                            'Due Date': cleanPayload['Due Date'] || '',
                            'Closed Date': cleanPayload['Closed Date'] || '',
                            'Status': cleanPayload['Status'] || 'Open',
                            'In_Charge': cleanPayload['In_Charge'] || '',
                            'Line': cleanPayload['Line'] || '',
                            'Attachment': cleanPayload['Attachment'] || '',
                            'Note': cleanPayload['Note'] || ''
                        }
                    };

                    await fetch(trimmedUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                        body: JSON.stringify(payloadToSend)
                    });
                    showToast("บันทึกข้อมูลอัปเดตไปสเปรดชีตเรียบร้อย!");
                } catch(e) {
                    console.error("Push failed:", e);
                    showToast("⚠️ บันทึกข้อมูลคลาวด์ขัดข้อง แต่บันทึกในเครื่องเรียบร้อย");
                }
                setIsCloudSyncing(false);
            };

            const availableYearsList = useMemo(() => {
                const years = new Set([currentYearValue, currentYearValue + 1, currentYearValue - 1]);
                allData.forEach(t => {
                    const dateVal = t['Opening Date'] || t.OpenedAt || t['Due Date'];
                    if (dateVal) {
                        const d = new Date(dateVal);
                        if (!isNaN(d.getTime())) {
                            years.add(d.getFullYear());
                        }
                    }
                });
                return Array.from(years).sort((a, b) => b - a);
            }, [allData, currentYearValue]);

            const generateNextId = () => {
                let maxNum = 0;
                allData.forEach(t => {
                    const id = String(t['Action Id'] || '').trim().toUpperCase();
                    if (id.startsWith('TASK-2026-')) {
                        const parts = id.split('-'); 
                        if (parts.length === 3) {
                            const numPart = parseInt(parts[2], 10);
                            if (!isNaN(numPart) && numPart > maxNum) {
                                maxNum = numPart;
                            }
                        }
                    }
                });
                const nextNum = maxNum + 1;
                return 'TASK-2026-' + String(nextNum).padStart(3, '0');
            };

            useEffect(() => {
                if (view === 'add') {
                    setNewItem(prev => ({ ...prev, 'Action Id': generateNextId() }));
                }
            }, [view, allData]);

            useEffect(() => setIsSidebarOpen(false), [view]);

            const myTasksRaw = useMemo(() => {
                return allData.filter(t => {
                    const nameFields = String(
                        t.In_Charge || t.InCharge || t.Owner || t.Raiser || t.Responsible || t.OwnerName || t.Rattanachot || ''
                    ).toLowerCase();
                    return nameFields.includes('rattanachot') || nameFields.includes('siriwanit') || nameFields.includes('รัตนโชติ') || nameFields.includes('650194');
                });
            }, [allData]);

            const myAllTasks = useMemo(() => {
                return myTasksRaw.filter(t => {
                    const statusStr = String(t.Status || '').toLowerCase();
                    const isClosed = statusStr.includes('close') || statusStr.includes('succ');
                    const dateStr = isClosed 
                        ? (t['Closed Date'] || t.ClosedAt || t.ClosedDate || t['Opening Date'] || t.OpenedAt)
                        : (t['Opening Date'] || t.OpenedAt || t['Due Date']);
                    const d = new Date(dateStr);
                    return !isNaN(d.getTime()) && d.getFullYear() === selectedYear;
                });
            }, [myTasksRaw, selectedYear]);

            const lineOptions = useMemo(() => {
                const counts = {};
                myAllTasks.forEach(t => {
                    const line = t.Line || t.Area || 'Unknown';
                    if (String(t.Status || '').toLowerCase().includes('open')) counts[line] = (counts[line] || 0) + 1;
                });
                return Object.entries(counts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
            }, [myAllTasks]);

            const lineStatsFilters = useMemo(() => {
                const stats = {};
                myAllTasks.forEach(t => {
                    const line = t.Line || t.Area || 'Unknown';
                    if (!stats[line]) stats[line] = { total: 0, unclosed: 0 };
                    stats[line].total += 1;
                    if (!String(t.Status || '').toLowerCase().includes('close') && !String(t.Status || '').toLowerCase().includes('succ')) stats[line].unclosed += 1;
                });
                return Object.entries(stats).map(([name, data]) => ({ name, ...data })).sort((a, b) => b.total - a.total);
            }, [myAllTasks]);

            const filteredTasks = useMemo(() => {
                let tasks = [...myAllTasks];
                if (search) {
                    tasks = tasks.filter(t => Object.values(t).some(v => String(v).toLowerCase().includes(search.toLowerCase())));
                }
                if (statusFilter !== 'All') {
                    const sf = statusFilter.toLowerCase();
                    tasks = tasks.filter(t => {
                         const s = String(t.Status || '').toLowerCase();
                         if (sf === 'in progress') return s.includes('progress');
                         return s.includes(sf);
                    });
                }
                if (lineFilter !== 'All') tasks = tasks.filter(t => (t.Line || t.Area || 'Unknown') === lineFilter);
                return tasks.sort((a, b) => {
                    if (sortBy === 'open_desc') return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);
                    if (sortBy === 'open_asc') return new Date(a['Opening Date'] || a.OpenedAt || 0) - new Date(b['Opening Date'] || b.OpenedAt || 0);
                    const getDue = (t) => { const d = t['Due Date'] || t['Due Date R/S*'] || t.DueDate; return d ? new Date(d).getTime() : null; };
                    if (sortBy === 'due_asc') return (getDue(a) || Infinity) - (getDue(b) || Infinity);
                    if (sortBy === 'due_desc') return (getDue(b) || -Infinity) - (getDue(a) || -Infinity);
                    if (String(a.Status).toLowerCase().includes('closed') && !String(b.Status).toLowerCase().includes('closed')) return 1;
                    if (!String(a.Status).toLowerCase().includes('closed') && String(b.Status).toLowerCase().includes('closed')) return -1;
                    return new Date(b['Opening Date'] || b.OpenedAt || 0) - new Date(a['Opening Date'] || a.OpenedAt || 0);
                });
            }, [myAllTasks, search, statusFilter, lineFilter, sortBy]);

            // 📊 ตรรกะวิเคราะห์สรุปความต่างของคำว่า "Opened" (เปิดใหม่ขึ้นจริงในเดือนนั้น) และ "Closed" (ปิดสะสมได้ในเดือนนั้น)
            const dashboardData = useMemo(() => {
                const months = Array(12).fill(0);
                const openCounts = Array(12).fill(0); // 🛠️ นับตาม Opening Date ของแต่ละเดือน (Opened)
                const closedCounts = Array(12).fill(0); // 🛠️ นับตาม Closed Date ของแต่ละเดือน (Closed)
                let totalSpent = 0;
                let totalClosed = 0;
                let pendingCount = 0;
                let progressCount = 0;
                let successCount = 0;
                let totalCount = 0;

                myTasksRaw.forEach(t => {
                    const statusStr = String(t.Status || '').toLowerCase();
                    const isClosed = statusStr.includes('close') || statusStr.includes('succ');
                    
                    // 1. ตรวจสอบจำนวน Job ที่ "เปิดใหม่" ในเดือนนั้นๆ โดยใช้ Opening Date เป็นหลัก
                    const openDateStr = t['Opening Date'] || t.OpenedAt;
                    if (openDateStr) {
                        const od = new Date(openDateStr);
                        if (!isNaN(od.getTime()) && od.getFullYear() === selectedYear) {
                            const month = od.getMonth();
                            openCounts[month] += 1;
                        }
                    }

                    // 2. ตรวจสอบจำนวนงานที่ปิดลงและยอดการใช้จ่าย
                    if (isClosed) {
                        const dateStr = t['Closed Date'] || t.ClosedAt || t.ClosedDate || t['Opening Date'] || t.OpenedAt;
                        const d = new Date(dateStr);
                        if (!isNaN(d.getTime()) && d.getFullYear() === selectedYear) {
                            const month = d.getMonth();
                            closedCounts[month] += 1;
                            totalClosed += 1;
                            
                            const cost = parseFloat(String(t.Cost || t.Budget || '0').replace(/,/g, "")) || 0;
                            if (cost > 0) {
                                months[month] += cost;
                                totalSpent += cost;
                            }
                        }
                    }

                    // 3. คำนวณสรุปสถิติทั่วไปในแถบ Overview
                    const activeOrOpenedDateStr = isClosed 
                        ? (t['Closed Date'] || t.ClosedAt || t.ClosedDate || t['Opening Date'] || t.OpenedAt)
                        : (t['Opening Date'] || t.OpenedAt || t['Due Date']);
                    
                    if (activeOrOpenedDateStr) {
                        const d = new Date(activeOrOpenedDateStr);
                        if (!isNaN(d.getTime()) && d.getFullYear() === selectedYear) {
                            totalCount++;
                            if (isClosed) {
                                successCount++;
                            } else if (statusStr.includes('progress')) {
                                progressCount++;
                            } else {
                                pendingCount++;
                            }
                        }
                    }
                });

                const maxCostVal = Math.max(...months, 1);
                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                
                const chart = months.map((val, idx) => ({
                    label: monthNames[idx],
                    val,
                    openCount: openCounts[idx],
                    closedCount: closedCounts[idx],
                    height: val > 0 ? Math.max((val / maxCostVal) * 100, 4) : 0
                }));

                return {
                    chart,
                    totalSpent,
                    totalClosed,
                    stats: {
                        total: totalCount,
                        open: pendingCount,
                        progress: progressCount,
                        closed: successCount
                    }
                };
            }, [myTasksRaw, selectedYear]);

            const handleGenerateSummary = async () => {
                if (myAllTasks.length === 0) return;
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setIsAiLoading(true);
                try {
                    let dataForAi = "";
                    const openTasks = myAllTasks.filter(t => String(t.Status || '').toLowerCase().includes('open') || String(t.Status || '').toLowerCase().includes('progress'));
                    const lineAnalysis = {};
                    openTasks.forEach(t => {
                        const line = t.Line || t.Area || 'Unknown';
                        if (!lineAnalysis[line]) lineAnalysis[line] = { count: 0, actions: [] };
                        lineAnalysis[line].count += 1;
                        lineAnalysis[line].actions.push('- [ ' + t.Status + ' ] ' + t.Title);
                    });
                    Object.entries(lineAnalysis).sort((a,b)=>b[1].count-a[1].count).slice(0,5).forEach(([line, data]) => {
                        dataForAi += 'Line: ' + line + ' (' + data.count + ' items):\n' + data.actions.join('\n') + '\n\n';
                    });
                    const summary = await fetchGemini('ข้อมูลคอขวดสะสมไลน์ผลิต:\n\n' + dataForAi + '\nแนะนำวิธีลดเวลาคอขวดการผลิต 3 ข้อกระชับสไตล์โรงงานญี่ปุ่น', userApiKey, "คุณคือผู้เชี่ยวชาญโรงงานและช่างเทคนิคอาวุโส", selectedModel);
                    setAiSummary(summary);
                } catch (error) { 
                    showToast("ไม่สามารถประมวลผลสรุป AI ได้"); 
                }
                setIsAiLoading(false);
            };

            const handleSuggestDescription = async () => {
                if (!newItem.Title) { showToast("ระบุหัวข้อเพื่อวิเคราะห์"); return; }
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setIsAiLoading(true);
                try {
                    const suggested = await fetchGemini('ช่วยเขียนอธิบายขั้นตอนดำเนินการวิศวกรรมการผลิตสั้นๆ สำหรับชื่องาน: "' + newItem.Title + '"', userApiKey, "คุณคือผู้เชี่ยวชาญโรงงานและช่างเทคนิคอาวุโส", selectedModel);
                    setNewItem(prev => ({ ...prev, Description: suggested }));
                } catch (error) { showToast("AI ทำงานขัดข้อง โปรดเช็คความถูกต้องของ API Key"); }
                setIsAiLoading(false);
            };

            const handleUploadCSV = (e) => {
                if (isReadOnly) return;
                const file = e.target.files[0]; if (!file) return;
                setSyncProgress("กำลังอ่านไฟล์ CSV...");
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const cleanText = ev.target.result.replace(/^\uFEFF/, '').trim();
                        const delimiter = cleanText.indexOf(';') !== -1 ? ';' : ',';
                        const rows = []; let row = []; let cur = ''; let inQuote = false;
                        for (let i = 0; i < cleanText.length; i++) {
                            const char = cleanText[i];
                            if (char === '"') inQuote = !inQuote;
                            else if (char === delimiter && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                            else if (char === '\n' && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); row = []; cur = ''; }
                            else if (char !== '\r') cur += char;
                        }
                        if (cur || row.length > 0) { row.push(cur.trim().replace(/^"|"$/g, '')); rows.push(row); }
                        const hIdx = rows.findIndex(r => r.some(c => String(c).toLowerCase().includes('id')));
                        const headers = rows[hIdx].map(h => h.trim());
                        let idIdx = headers.findIndex(h => h.toLowerCase() === 'action id');
                        if (idIdx === -1) idIdx = headers.findIndex(h => h.toLowerCase().includes('id'));
                        
                        const dataRows = rows.slice(hIdx + 1).filter(r => r[idIdx]);
                        const updated = [...allData];
                        dataRows.forEach(r => {
                            const rawId = String(r[idIdx]);
                            const formattedCleanId = cleanAndFormatId(rawId);
                            if (formattedCleanId.length > 1) {
                                const obj = { 
                                    _id: formattedCleanId, 
                                    'Action Id': formattedCleanId,
                                    Source: 'SIM2 CSV' 
                                };
                                headers.forEach((h, idx) => { if (h && r[idx] !== undefined) obj[h.replace(/[./*\[\]#$]/g, '_')] = r[idx]; });
                                
                                const matchIdx = updated.findIndex(t => t._id === formattedCleanId);
                                if (matchIdx !== -1) {
                                    updated[matchIdx] = { ...updated[matchIdx], ...obj };
                                } else {
                                    updated.push(obj);
                                }
                            }
                        });
                        setAllData(updated);
                        showToast(`นำเข้าเสร็จสิ้น ${dataRows.length} รายการ`);
                        
                        if (sheetUrl) {
                            for (let rowObj of updated) {
                                await pushToGoogleSheets('upsert', rowObj);
                            }
                        }
                    } catch (err) { showToast("Sync CSV Failed"); }
                    setSyncProgress(null);
                };
                reader.readAsText(file);
            };

            const handleAddItem = async (e) => {
                e.preventDefault();
                if (isReadOnly) return;
                
                if (!newItem['Action Id'] || !newItem.Title || !newItem.Line) { showToast("กรุณากรอกข้อมูลสำคัญให้ครบ"); return; }

                const formattedId = cleanAndFormatId(newItem['Action Id']);
                const defaultDueDate = new Date(); 
                defaultDueDate.setDate(defaultDueDate.getDate() + 7);
                const finalDueDate = newItem['Due Date'] ? new Date(newItem['Due Date']).toISOString() : defaultDueDate.toISOString();
                
                const isStatusClosed = String(newItem.Status).toLowerCase().includes('close');
                const finalClosedDate = isStatusClosed ? new Date().toISOString() : '';

                const taskObj = { 
                    ...newItem, 
                    _id: formattedId,
                    'Due Date': finalDueDate, 
                    'Closed Date': finalClosedDate,
                    Source: 'Manual Entry', 
                    'Action Id': formattedId, 
                    editCount: 0 
                };

                const updated = [taskObj, ...allData.filter(t => t._id !== formattedId)];
                setAllData(updated);
                showToast("บันทึกเข้าระบบเรียบร้อย!");

                if (sheetUrl) {
                    await pushToGoogleSheets('upsert', taskObj);
                }

                setNewItem({ 
                    'Action Id': '', 'Title': '', 'Description': '', 'Cost': '', 'Opening Date': new Date().toISOString(), 'Due Date': '', 'Closed Date': '', 'Status': 'Open', 'In_Charge': 'Rattanachot Siriwanit', 'Line': '', 'Attachment': '' 
                });
                setView('list');
            };

            const confirmDelete = async () => { 
                if (isReadOnly) return; 
                setAllData(allData.filter(t => t._id !== deleteConfirm.id));
                showToast("ลบ Action ดำเนินการเสร็จสิ้น"); 
                
                if (sheetUrl) {
                    await pushToGoogleSheets('delete', { 'Action Id': deleteConfirm.id });
                }
                setDeleteConfirm(null); 
            };

            const saveCostEdit = async (id, val) => {
                if (isReadOnly) return;
                const updated = allData.map(t => t._id === id ? { ...t, Cost: val } : t);
                setAllData(updated);
                setEditingCostId(null);
                const match = updated.find(t => t._id === id);
                if (match && sheetUrl) {
                    await pushToGoogleSheets('upsert', match);
                }
            };

            const saveDescEdit = async (id, val) => {
                if (isReadOnly) return;
                const updated = allData.map(t => t._id === id ? { ...t, Description: val, editCount: (t.editCount || 0) + 1 } : t);
                setAllData(updated);
                setEditingDescId(null);
                const match = updated.find(t => t._id === id);
                if (match && sheetUrl) {
                    await pushToGoogleSheets('upsert', match);
                }
            };

            const saveDueDateEdit = async (id, val) => {
                if (isReadOnly) return;
                const finalD = val ? new Date(val).toISOString() : '';
                const updated = allData.map(t => t._id === id ? { ...t, 'Due Date': finalD } : t);
                setAllData(updated);
                setEditingDueDateId(null);
                const match = updated.find(t => t._id === id);
                if (match && sheetUrl) {

                }

                const match = allData.find(t => t._id === id);
                if (match && sheetUrl) {
                    await pushToGoogleSheets('upsert', match);
                }

                if (isReadOnly) return;

                        let next = 'Open';
                        let closedDateVal = '';
                        if (s.includes('open')) {
                            next = 'In Progress';
                        } else if (s.includes('progress')) {
                            next = 'Closed';
                            closedDateVal = new Date().toISOString(); 
                        }
                        return { ...t, Status: next, 'Closed Date': closedDateVal };
                    }
                    return t;
                });
                setAllData(updated);

                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 400; let scaleSize = 1;
                        if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                        canvas.width = img.width * scaleSize; canvas.height = img.height * scaleSize;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const base64Img = canvas.toDataURL('image/jpeg', 0.5);
                        const updated = allData.map(t => t._id === id ? { ...t, Image: base64Img } : t);
                        setAllData(updated);
                        showToast("อัปโหลดรูปภาพหลักฐานเสร็จสิ้น!");
                        setSyncProgress(null);

                        const match = updated.find(t => t._id === id);
                        if (match && sheetUrl) {

                        }

                    img.src = event.target.result;
                };

                                    <button onClick={() => setShowApiKeyModal(false)} className="py-3 px-4 bg-slate-900 text-slate-400 hover:text-slate-200 rounded-xl text-xs font-bold uppercase transition" style={{ minHeight: '44px' }}>Cancel</button>
                                    <button onClick={clearApiKey} className="py-3 px-4 bg-red-950/20 text-red-400 hover:bg-red-950/40 rounded-xl text-xs font-bold uppercase transition mr-auto" style={{ minHeight: '44px' }}>Clear Settings</button>
                                    <button onClick={saveApiKey} className="py-3 px-5 bg-teal-500 text-slate-950 rounded-xl text-xs font-bold uppercase transition" style={{ minHeight: '44px' }}>Save Key</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 📲 หน้าต่างโมดอลสำหรับแสดง QR Code นำทางและซิงค์ข้อมูลบนมือถือ (Mobile QR Sync Modal) */}
                    {showQrModal && (
                        <div className="fixed inset-0 z-[500] flex items-center justify-center bg-black/90 backdrop-blur-md animate-fadeIn" onClick={() => setShowQrModal(false)}>
                            <div className="bg-[#090d16] p-8 rounded-3xl max-w-sm w-full border border-teal-500/20 text-center shadow-2xl relative space-y-6" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setShowQrModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-slate-300" style={{ minWidth: '44px', minHeight: '44px' }}><Icon name="X" size={22} /></button>
                                
                                <div>
                                    <h3 className="font-bold text-white uppercase tracking-wider text-sm flex items-center justify-center gap-2">
                                        <Icon name="Share" className="text-teal-400" />
                                        ซิงค์ตั้งค่าไปที่มือถือ
                                    </h3>
                                    <p className="text-slate-400 text-[10px] mt-1">สแกนโค้ดนี้ด้วยโทรศัพท์มือถือของคุณเพื่อนำสิทธิ์การตั้งค่าและดึงสเปรดชีตมาแสดงผลทันที</p>
                                </div>

                                {/* QR Code Generator API (ใช้ค่า Link Sync ที่เข้ารหัสสเปรดชีตและคีย์เสร็จสรรพ) */}
                                <div className="bg-white p-4 rounded-2xl inline-block shadow-lg mx-auto border border-teal-500/10">
                                    <img 
                                        src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=0f172a&bgcolor=ffffff&data=${encodeURIComponent(getMobileSyncLink())}`} 
                                        alt="Mobile Sync QR Code"
                                        className="w-48 h-48"
                                    />
                                </div>

                                <div className="space-y-2">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">ลิงก์นำเข้าสิทธิ์คลาวด์ตรง</span>
                                    <input 
                                        type="text" 
                                        readOnly 
                                        value={getMobileSyncLink()} 
                                        className="w-full p-2.5 bg-slate-950 text-slate-400 border border-slate-900 rounded-xl text-[9px] font-mono outline-none text-center truncate select-all" 
                                    />
                                    <button 
                                        onClick={() => {
                                            document.execCommand('copy');
                                            showToast("คัดลอกลิงก์ซิงค์เรียบร้อย!");
                                        }}
                                        className="w-full py-2 bg-slate-900 hover:bg-slate-850 text-teal-400 text-[10px] font-bold uppercase rounded-lg border border-slate-800 transition"
                                        style={{ minHeight: '36px' }}
                                    >
                                        คัดลอกลิงก์ส่งต่อไปยังกลุ่มไลน์
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
    </script>

    <!-- Secure Compilation and Execution Sandbox Engine -->
    <script>
        function compileAndRun() {
            try {
                const rawText = document.getElementById('react-code-holder').textContent;
                const compiled = Babel.transform(rawText, {
                    presets: [
                        ['react', { runtime: 'classic' }] 
                    ]
                }).code;
                
                const scriptNode = document.createElement('script');
                scriptNode.text = compiled;
                document.body.appendChild(scriptNode);
                
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
            } catch (err) {
                console.error("Compilation failed, retrying in 100ms...", err.message);
                setTimeout(compileAndRun, 100);
            }
        }

        window.onload = compileAndRun;
    </script>
</body>
</html>
