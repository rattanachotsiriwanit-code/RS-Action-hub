<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Action Hub</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase Compat (Stable for Browser) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // ระบบดักจับอาการจอขาว
        window.addEventListener('error', function(e) {
            if(e.message.includes('react/jsx-runtime')) {
                console.warn('React Runtime conflict detected. Re-initializing...');
            }
        });
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- บรรจุโค้ดไว้ในนี้เพื่อสั่ง Babel แปลงแบบ Classic ป้องกันหน้าขาว -->
    <script type="text/plain" id="react-src">
        const { useState, useEffect, useMemo, Fragment } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBpb35n86yKm-etaqI9ilvPosBe4OyDogs",
            authDomain: "sim2-management-rattanachot.firebaseapp.com",
            projectId: "sim2-management-rattanachot",
            storageBucket: "sim2-management-rattanachot.firebasestorage.app",
            messagingSenderId: "1050876853626",
            appId: "1:1050876853626:web:a9cfa2b91416426a686ac3",
            measurementId: "G-KE7P699K7N"
        };

        // Initialize Firebase
        let db;
        try {
            const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
            db = firebase.firestore(app);
            db.settings({ experimentalForceLongPolling: true });
            firebase.auth().signInAnonymously();
        } catch(e) { console.error("Firebase Auth Fail", e); }

        const MASTER_LINE_NAMES = [
            "D Auto Pole assembly machine 1", "D Auto Pole assembly manual 1", "D Auto Thermal (W03-W07) No.1", "D Auto coil (W01+02) No.1", "D Auto coil (W01+02) No.2", "D Auto coil (W01+02) No.3", "D Auto coil (W01+02) No.4", "D Auto coil (W01+02) No.5", "D Finishing 1", "D Finishing 2", "D Finishing 3", "D Finishing 4", "D Finishing 5", "D Finishing 6", "D M5 Finishing 2", "D M5 Finishing 3", "D M5 Finishing 4","SA Pole assy", "D M5 Finishing 5", "D M5 Finishing 6","SA Cut&Fuse","SA Mag Yoke","SA Manual sub assembly Qovs","SA Manual sub assembly Rocket", "D Thermal W03-W06 Line 1", "D Thermal W03-W06 Line 2", "D Thermal W03-W06 Line 3", "D Thermal W03-W06 Line 4", "D Thermal W07 Manual", "D Thermal W07 Semi auto", "D Welding Coil", "SA Auto Pole assembly machine 1","SA Contact Press Spring", "SA Auto Pole assembly machine 2", "SA Auto Pole assembly manual 1", "SA Auto Pole assembly manual 2", "SA Pole assy 1", "SA Pole assy 2", "SA Pole assy 3", "SA Pole assy 4"
        ];

        const formatDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }).replace(/ /g,'-') : '---';

        const App = () => {
            const [allData, setAllData] = useState([]);
            const [view, setView] = useState('dashboard');
            const [search, setSearch] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [sortBy, setSortBy] = useState('default');
            const [expandedId, setExpandedId] = useState(null);
            const [msg, setMsg] = useState(null);
            
            const [editingDescId, setEditingDescId] = useState(null);
            const [tempDesc, setTempDesc] = useState('');
            const [editingDueDateId, setEditingDueDateId] = useState(null);
            const [tempDueDate, setTempDueDate] = useState('');
            
            const [editingCostId, setEditingCostId] = useState(null);
            const [tempCost, setTempCost] = useState('');

            const [newItem, setNewItem] = useState({ 'Action Id': '', 'Title': '', 'Description': '', 'Cost': '', 'Opening Date': new Date().toISOString(), 'Due Date': '', 'Status': 'Open', 'Line': '', 'In_Charge': 'Rattanachot Siriwanit' });

            useEffect(() => {
                const unsub = db.collection('artifacts/sim2-mgmt-rattanachot/public/data/actions')
                    .onSnapshot(snap => setAllData(snap.docs.map(d => ({ ...d.data(), _id: d.id }))));
                return () => unsub();
            }, []);

            // Auto-run ID Logic
            useEffect(() => {
                if (view === 'add' && !newItem['Action Id']) {
                    let maxNum = 0;
                    allData.forEach(t => {
                        if (String(t['Action Id']).startsWith('2026-')) {
                            const n = parseInt(t['Action Id'].split('-')[1]);
                            if (n > maxNum) maxNum = n;
                        }
                    });
                    setNewItem(prev => ({ ...prev, 'Action Id': `2026-${String(maxNum + 1).padStart(3, '0')}` }));
                }
            }, [view, allData]);

            const monthlyCosts = useMemo(() => {
                const costs = Array(12).fill(0);
                allData.forEach(t => {
                    // Filter specifically for "Rattanachot" tasks to keep dashboard matching search rules
                    const isMe = String(t.In_Charge || t.Owner || '').toLowerCase().includes('rattanachot');
                    if (isMe) {
                        const dateStr = t['Opening Date'] || t['Due Date'];
                        if (dateStr) {
                            const date = new Date(dateStr);
                            if (date.getFullYear() === 2026) {
                                const month = date.getMonth(); // 0-11
                                const val = parseFloat(t.Cost) || 0;
                                costs[month] += val;
                            }
                        }
                    }
                });
                return costs;
            }, [allData]);

            const maxMonthlyCost = useMemo(() => {
                const max = Math.max(...monthlyCosts);
                return max > 0 ? max : 1; // Prevent divide by zero
            }, [monthlyCosts]);

            const totalYearlyCost = useMemo(() => {
                return monthlyCosts.reduce((a, b) => a + b, 0);
            }, [monthlyCosts]);

            const filteredTasks = useMemo(() => {
                let tasks = allData.filter(t => {
                    const isMe = String(t.In_Charge || t.Owner || '').toLowerCase().includes('rattanachot');
                    return isMe && Object.values(t).some(v => String(v).toLowerCase().includes(search.toLowerCase()));
                });
                if (statusFilter !== 'All') tasks = tasks.filter(t => String(t.Status).includes(statusFilter.replace('In ', '')));
                
                return tasks.sort((a, b) => {
                    if (sortBy === 'due_asc') return new Date(a['Due Date'] || Infinity) - new Date(b['Due Date'] || Infinity);
                    if (sortBy === 'open_desc') return new Date(b['Opening Date'] || 0) - new Date(a['Opening Date'] || 0);
                    return 0;
                });
            }, [allData, search, statusFilter, sortBy]);

            const stats = useMemo(() => ({
                total: filteredTasks.length,
                open: filteredTasks.filter(t => String(t.Status).toLowerCase().includes('open')).length,
                progress: filteredTasks.filter(t => String(t.Status).toLowerCase().includes('progress')).length,
                closed: filteredTasks.filter(t => String(t.Status).toLowerCase().includes('close')).length
            }), [filteredTasks]);

            const handleAddItem = async (e) => {
                e.preventDefault();
                await db.collection('artifacts/sim2-mgmt-rattanachot/public/data/actions').doc(newItem['Action Id']).set({ ...newItem, Source: 'Manual' }, { merge: true });
                setMsg("Saved!"); 
                setView('list');
                // Reset newItem configuration
                setNewItem({ 'Action Id': '', 'Title': '', 'Description': '', 'Cost': '', 'Opening Date': new Date().toISOString(), 'Due Date': '', 'Status': 'Open', 'Line': '', 'In_Charge': 'Rattanachot Siriwanit' });
            };

            return (
                <div className="flex h-screen bg-[#f8fafc] font-sans">
                    <aside className="w-64 bg-[#262626] text-white flex flex-col p-6">
                        <div className="text-2xl font-black italic text-[#3dcd58] mb-10">RS HUB</div>
                        <nav className="flex-1 space-y-2">
                            <button onClick={() => setView('dashboard')} className={`w-full text-left p-3 rounded ${view === 'dashboard' ? 'bg-[#3dcd58] font-bold' : 'text-gray-400'}`}>OVERVIEW</button>
                            <button onClick={() => setView('list')} className={`w-full text-left p-3 rounded ${view === 'list' ? 'bg-[#3dcd58] font-bold' : 'text-gray-400'}`}>MASTER LIST</button>
                            <button onClick={() => setView('add')} className={`w-full text-left p-3 rounded ${view === 'add' ? 'bg-[#3dcd58] font-bold' : 'text-gray-400'}`}>+ ADD ACTION</button>
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-16 bg-white border-b px-8 flex items-center justify-between">
                            <div className="font-bold uppercase italic text-gray-500 text-sm">RS Action Command Center</div>
                            <input type="text" placeholder="Search..." className="bg-gray-100 border-none rounded-full px-4 py-1.5 text-xs w-64 focus:ring-2 focus:ring-[#3dcd58]" onChange={e => setSearch(e.target.value)} />
                        </header>

                        <div className="flex-1 overflow-y-auto p-8">
                            {msg && <div className="fixed top-5 right-5 bg-black text-white p-3 rounded shadow-xl z-50 text-xs">{msg}</div>}
                            
                            {view === 'dashboard' ? (
                                <div className="space-y-8">
                                    <div className="grid grid-cols-4 gap-6">
                                        <div className="bg-white p-6 rounded-2xl border-l-4 border-amber-400 shadow-sm"><div className="text-3xl font-black">{stats.open}</div><div className="text-[10px] text-gray-400 font-bold uppercase">Pending</div></div>
                                        <div className="bg-white p-6 rounded-2xl border-l-4 border-blue-400 shadow-sm"><div className="text-3xl font-black">{stats.progress}</div><div className="text-[10px] text-gray-400 font-bold uppercase">In Progress</div></div>
                                        <div className="bg-white p-6 rounded-2xl border-l-4 border-emerald-400 shadow-sm"><div className="text-3xl font-black">{stats.closed}</div><div className="text-[10px] text-gray-400 font-bold uppercase">Success</div></div>
                                        <div className="bg-white p-6 rounded-2xl border-l-4 border-indigo-400 shadow-sm"><div className="text-3xl font-black">{stats.total}</div><div className="text-[10px] text-gray-400 font-bold uppercase">Total</div></div>
                                    </div>
                                    
                                    {}
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-center mb-6">
                                            <div>
                                                <div className="text-sm font-bold italic text-gray-800">Cost Trend 2026</div>
                                                <div className="text-[10px] text-gray-400 uppercase font-bold mt-1">Accumulated Monthly Action Expense</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[10px] text-gray-400 font-bold uppercase">Total Budget</div>
                                                <div className="text-lg font-black text-[#3dcd58]">{totalYearlyCost.toLocaleString()} ฿</div>
                                            </div>
                                        </div>
                                        <div className="h-44 flex items-end gap-3 border-b pb-2 px-1">
                                            {monthlyCosts.map((cost, i) => {
                                                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                                                const pct = (cost / maxMonthlyCost) * 100;
                                                return (
                                                    <div key={i} className="flex-1 flex flex-col items-center group relative h-full justify-end">
                                                        {/* Tooltip on Hover */}
                                                        <div className="absolute bottom-full mb-2 hidden group-hover:flex flex-col items-center z-10 transition-all duration-200">
                                                            <div className="bg-black text-white text-[10px] font-black py-1 px-2 rounded shadow-lg whitespace-nowrap">
                                                                {cost.toLocaleString()} ฿
                                                            </div>
                                                            <div className="w-1.5 h-1.5 bg-black rotate-45 -mt-1"></div>
                                                        </div>

                                                        {/* Animated Bar graph */}
                                                        <div 
                                                            className={`w-full rounded-t-lg transition-all duration-300 relative cursor-pointer flex items-end justify-center ${cost > 0 ? 'bg-emerald-400 hover:bg-[#3dcd58]' : 'bg-gray-100 hover:bg-gray-200'}`}
                                                            style={{ height: `${Math.max(pct, cost > 0 ? 8 : 4)}%` }}
                                                        >
                                                            {cost > 0 && (
                                                                <span className="text-[8px] font-bold text-white mb-1 pointer-events-none hidden md:inline">
                                                                    {cost >= 1000 ? `${(cost/1000).toFixed(0)}k` : cost}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <div className="text-[10px] font-black text-gray-400 mt-2 uppercase">{months[i]}</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            ) : view === 'add' ? (
                                <div className="max-w-xl mx-auto bg-white p-8 rounded-3xl shadow-sm border">
                                    <h3 className="font-black italic uppercase mb-6">Job Deployment</h3>
                                    <form onSubmit={handleAddItem} className="space-y-4">
                                        <div><label className="text-[10px] font-bold text-gray-400 uppercase">Action ID</label><input className="w-full p-3 bg-gray-50 border rounded-xl font-bold" value={newItem['Action Id']} readOnly /></div>
                                        <div><label className="text-[10px] font-bold text-gray-400 uppercase">Title</label><input className="w-full p-3 border rounded-xl" value={newItem.Title} onChange={e => setNewItem({...newItem, Title: e.target.value})} required /></div>
                                        <div><label className="text-[10px] font-bold text-gray-400 uppercase">Line Name</label>
                                            <select className="w-full p-3 border rounded-xl" value={newItem.Line} onChange={e => setNewItem({...newItem, Line: e.target.value})} required>
                                                <option value="">-- Select Line --</option>
                                                {MASTER_LINE_NAMES.map(l => <option key={l} value={l}>{l}</option>)}
                                            </select>
                                        </div>
                                        <div><label className="text-[10px] font-bold text-gray-400 uppercase">Due Date</label><input type="date" className="w-full p-3 border rounded-xl" onChange={e => setNewItem({...newItem, 'Due Date': e.target.value ? new Date(e.target.value).toISOString() : ''})} required /></div>
                                        
                                        {/* Added Cost Input Field */}
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-400 uppercase">Cost Budget (฿)</label>
                                            <input type="number" placeholder="Enter cost amount in Baht" className="w-full p-3 border rounded-xl" value={newItem.Cost} onChange={e => setNewItem({...newItem, Cost: e.target.value})} />
                                        </div>
                                        <button className="w-full py-4 bg-black text-white rounded-xl font-bold uppercase italic hover:bg-[#3dcd58] transition">Deploy Action</button>
                                    </form>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center mb-4">
                                        <div className="flex gap-2">
                                            {['All', 'Open', 'In Progress', 'Closed'].map(s => <button key={s} onClick={() => setStatusFilter(s)} className={`px-4 py-1.5 rounded-full text-[10px] font-bold uppercase ${statusFilter === s ? 'bg-black text-white' : 'bg-white border'}`}>{s}</button>)}
                                        </div>
                                        <select className="text-[10px] font-bold border rounded-lg p-2" onChange={e => setSortBy(e.target.value)}>
                                            <option value="default">Sort by: Default</option>
                                            <option value="open_desc">Date: Newest</option>
                                            <option value="due_asc">Due Date: Nearest</option>
                                        </select>
                                    </div>
                                    <div className="bg-white rounded-2xl shadow-sm border divide-y overflow-hidden">
                                        {filteredTasks.map(t => (
                                            <div key={t._id} className="flex flex-col">
                                                <div onClick={() => setExpandedId(expandedId === t._id ? null : t._id)} className="p-5 flex items-center justify-between cursor-pointer hover:bg-gray-50">
                                                    <div className="flex-1">
                                                        <div className="text-sm font-bold text-gray-800 uppercase italic leading-tight">{t.Title}</div>
                                                        <div className="text-[9px] text-gray-400 font-bold mt-1">ID: {t['Action Id']} | Line: {t.Line || '---'}</div>
                                                        <div className="flex gap-4 mt-1 text-[9px] font-bold uppercase">
                                                            <span className="text-gray-500">Open: {formatDate(t['Opening Date'])}</span>
                                                            <span className="text-rose-500">Due: {formatDate(t['Due Date'])}</span>
                                                            {t.Cost && <span className="text-[#3dcd58]">Cost: {(parseFloat(t.Cost) || 0).toLocaleString()} ฿</span>}
                                                        </div>
                                                    </div>
                                                    <div className={`px-3 py-1 rounded text-[9px] font-black uppercase italic ${String(t.Status).toLowerCase().includes('open') ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}`}>{t.Status}</div>
                                                </div>
                                                {expandedId === t._id && (
                                                    <div className="p-6 bg-gray-50 border-t grid grid-cols-2 gap-6 animate-in">
                                                        <div className="space-y-4">
                                                            <div className="relative group">
                                                                <label className="text-[9px] font-bold text-[#3dcd58]">DETAILS {t.editCount > 0 && `(Edited ${t.editCount}x)`}</label>
                                                                {editingDescId === t._id ? (
                                                                    <div className="space-y-2">
                                                                        <textarea className="w-full p-3 text-xs border rounded-xl outline-none" value={tempDesc} onChange={e => setTempDesc(e.target.value)} />
                                                                        <button onClick={async () => {
                                                                            await db.collection('artifacts/sim2-mgmt-rattanachot/public/data/actions').doc(t._id).update({ Description: tempDesc, editCount: (t.editCount || 0) + 1 });
                                                                            setEditingDescId(null);
                                                                        }} className="bg-[#3dcd58] text-white px-3 py-1 text-[10px] font-bold rounded">SAVE</button>
                                                                    </div>
                                                                ) : (
                                                                    <div onClick={() => { setEditingDescId(t._id); setTempDesc(t.Description); }} className="p-4 bg-white rounded-xl text-xs italic text-gray-600 border border-dashed cursor-edit">{t.Description || 'Click to add detail'}</div>
                                                                )}
                                                            </div>
                                                        </div>
                                                        
                                                        {}
                                                        <div className="space-y-4">
                                                            <div className="bg-white p-4 rounded-xl border border-gray-100">
                                                                <label className="text-[9px] font-bold text-rose-500">DUE DATE {t.dueDateEditCount > 0 && `(${t.dueDateEditCount}x)`}</label>
                                                                {editingDueDateId === t._id ? (
                                                                    <input type="date" autoFocus onBlur={async (e) => {
                                                                        if (e.target.value) {
                                                                            await db.collection('artifacts/sim2-mgmt-rattanachot/public/data/actions').doc(t._id).update({ 'Due Date': new Date(e.target.value).toISOString(), dueDateEditCount: (t.dueDateEditCount || 0) + 1 });
                                                                        }
                                                                        setEditingDueDateId(null);
                                                                    }} className="w-full text-xs font-bold mt-1" />
                                                                ) : (
                                                                    <div onClick={() => setEditingDueDateId(t._id)} className="text-sm font-bold text-gray-700 cursor-pointer">{formatDate(t['Due Date'])}</div>
                                                                )}
                                                            </div>

                                                            {/* Editable Cost Card */}
                                                            <div className="bg-white p-4 rounded-xl border border-gray-100">
                                                                <label className="text-[9px] font-bold text-emerald-500">BUDGET COST (฿)</label>
                                                                {editingCostId === t._id ? (
                                                                    <div className="flex gap-2 items-center mt-1">
                                                                        <input type="number" className="p-1 text-xs border rounded-lg w-full font-bold focus:ring-1 focus:ring-[#3dcd58]" value={tempCost} onChange={e => setTempCost(e.target.value)} autoFocus />
                                                                        <button onClick={async () => {
                                                                            await db.collection('artifacts/sim2-mgmt-rattanachot/public/data/actions').doc(t._id).update({ Cost: parseFloat(tempCost) || 0 });
                                                                            setEditingCostId(null);
                                                                        }} className="bg-black text-white px-2.5 py-1 text-[10px] font-bold rounded-lg hover:bg-[#3dcd58]">Save</button>
                                                                    </div>
                                                                ) : (
                                                                    <div onClick={() => { setEditingCostId(t._id); setTempCost(t.Cost || 0); }} className="text-sm font-bold text-gray-700 cursor-pointer hover:text-[#3dcd58] transition-colors">
                                                                        {(parseFloat(t.Cost) || 0).toLocaleString()} ฿ <span className="text-[9px] text-gray-400 font-normal ml-1">(Click to edit)</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Babel Classic Compiler Logic -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const src = document.getElementById('react-src').textContent;
            const code = Babel.transform(src, { presets: [['env', {modules:false}], ['react', {runtime:'classic'}]] }).code;
            const s = document.createElement('script');
            s.textContent = code;
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
